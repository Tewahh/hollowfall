<title>Hollowfall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Special+Elite&display=swap">
<style>
/* Layout: one-screen console. Status strip on top, scrolling story log in the middle, action deck pinned at the bottom. */
:root{
  --ground:#171512; --panel:#201d19; --line:#3a352e; --shadow:#0c0b09;
  --bone:#e8e1cf; --dim:#a29b8b;
  --torch:#d98a2b; --blood:#b8452f; --blood-text:#e98a70; --moss:#97ad66; --ice:#7fb4bb; --violet:#c9a0ee; --gold:#f0b455;
  --display:'Special Elite','Courier New',ui-monospace,monospace;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--ground);color:var(--bone);font:16px/1.5 var(--body);
  margin:0;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.status{flex:none;display:flex;flex-direction:column;gap:7px;padding-bottom:9px;border-bottom:2px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{margin:0;font:400 22px/1.1 var(--display);color:var(--torch);text-wrap:balance;min-width:0}
#day{font:500 13px var(--display);color:var(--dim);letter-spacing:.08em;text-transform:uppercase;text-align:right}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lab{font:500 13px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;background:var(--panel);border:1px solid var(--line);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0}
.hp i{background:var(--blood)} .food i{background:var(--torch)} .xp i{background:var(--ice)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
.chips{display:flex;flex-wrap:wrap;gap:3px 14px;font:500 14px var(--display);color:var(--dim);font-variant-numeric:tabular-nums}
.chips span:empty{display:none}
#em{color:var(--moss)} #ec{color:var(--ice)} #bf{color:var(--torch)} #ti{color:var(--gold)}
#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:2px;overscroll-behavior:contain}
.e{margin:0;max-width:64ch;text-wrap:pretty}
.e.sys{color:var(--dim)}
.e.hit{color:var(--blood-text)}
.e.win{color:var(--moss)}
.e.loot{color:var(--torch)}
.e.lvl{color:var(--ice);font-weight:700}
.e.npc{font-style:italic}
.e.day{font:500 12px var(--display);color:var(--dim);text-align:center;letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
#deck{flex:none;max-height:48%;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:2px solid var(--line);overscroll-behavior:contain}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid.one{grid-template-columns:minmax(0,1fr)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.btn{
  font:400 16px/1.2 var(--display);min-height:46px;padding:8px 10px;
  background:var(--panel);color:var(--bone);border:1.5px solid var(--line);border-radius:2px;
  cursor:pointer;text-align:center;letter-spacing:.02em;
}
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(1.25)}
.btn.primary,.btn.on{background:var(--torch);color:#1b1208;border-color:#e8a24e}
.btn.danger{border-color:var(--blood);color:var(--blood-text)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.btn.sm{min-height:38px;padding:4px 12px;font-size:14px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dh h2{margin:0;font:400 19px var(--display);color:var(--torch)}
.sec{margin:6px 0 0;font:500 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:7px 0;border-bottom:1px solid var(--line)}
.rt{min-width:0;flex:1 1 170px}
.rt b{display:block;font-weight:700}
.rt small{display:block;color:var(--dim);font-size:14px;line-height:1.35}
.ra{display:flex;flex-wrap:wrap;gap:6px;flex:none;justify-content:flex-end}
.ra:empty{display:none}
.ok{color:var(--moss)} .no{color:var(--blood-text)}
.r1{color:var(--moss)} .r2{color:var(--ice)} .r3{color:var(--violet)} .r4{color:var(--gold)}
.foe{display:flex;flex-direction:column;gap:2px}
.foe b{font:400 19px var(--display)}
.foe .bar{height:10px;margin-top:2px}
.foe .bar i{background:var(--blood)}
.foe small{color:var(--dim);font-variant-numeric:tabular-nums;min-height:1.3em}
.foe small.warn,.hint.warn{color:var(--blood-text);font-weight:700}
.hint{margin:0;color:var(--dim);font-size:14px}
textarea{width:100%;background:var(--panel);color:var(--bone);border:1.5px solid var(--line);border-radius:2px;font:13px/1.3 ui-monospace,monospace;padding:6px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
</style>

</div>

    intro:'There is nothing in front of you. There is nothing in front of you the way there is nothing in a sleeping mouth. Then the nothing leans in, and you understand that it has been in your head the whole way here.',
    won:'The Quiet does not fall. It simply stops being in front of you. For a long moment there is only the sound of your own breath, which is, you realize, the first sound you have been glad of in months.'}

/* ---- scenes: l lines, c choices {t,l,e,if}, e effects ---- */
const SC={
 s_intro:{l:[
  `The camp is a ring of tents around a fire somebody has fed for months. The ash falls on everything and nobody brushes it off any more.`,
  `A woman with a ledger under her arm studies you the way you would study a door you are about to open.`,
  `Mara: "You are awake. Good. I am Mara. I count the food, the beds, and the dead, in that order. Where did you come from?"`],
  c:[{t:'I scavenged, mostly.',l:[`Mara: "Then you know what a locked door is worth. Good."`],e:{f:'bg_scav',it:{ration:2}}},
     {t:'I carried a weapon for somebody.',l:[`Mara: "Then you know what you are worth when they stop paying. Good."`],e:{f:'bg_sold'}},
     {t:'I read. I kept records.',l:[`Mara: "A reader. Do not tell the raiders. They burn those first."`],e:{f:'bg_schol'}}],
  e:{q:'m1',lore:'mara'}},
 m1d:{l:[`Mara counts the hides without looking at you.`,`Mara: "Six. Good. The camp sleeps one night easier. Now you are on the ledger."`]},
 m2d:{l:[`Mara hangs the cord herself, tying each knot twice.`,`Mara: "The nets will hold. Barely. Everything holds barely, here."`]},
 m3a:{l:[`The forge is a trench of coals under a canvas roof. A man the size of a doorway looks up from the anvil.`,`Bran: "You are the new one. Mara says you can fetch iron. I say show me."`]},
 m3d:{l:[`Bran turns each bar in the light, once, like a jeweler.`,`Bran: "Good steel. Good hands. My forge is yours whenever you have the iron and the patience."`],e:{bld:['forge',1],f:'bran',lore:'bran'}},
 m4a:{l:[`Mara: "A boar the size of a cart took the hunting party. They are not coming back. Neither will the food, unless it does."`]},
 m4d:{l:[`You drag a tusk the length of your arm back into camp. Mara studies it for a long time.`,`Mara: "There is a village east. The Quiet Hamlet. Nobody who went there has come back. Maybe somebody is still there to be found."`]},
 arr_village:{l:[`Doors hang open. Laundry still on the lines, stiff with ash. Somewhere above you a bell swings with no wind.`,`A thin voice from the tower: Odo: "If you are not hollow, could you say something? I have been counting my own breaths for three days."`]},
 m5d:{l:[`A man in a patched habit climbs down the bell-tower ladder, bruised and, impossibly, cheerful.`,`Odo: "Brother Odo. I rang the bell. They walked out singing, all of them, and I thought it was a procession. It was not a procession."`,`Odo: "Take me with you. I can bandage. I can pray. I am a very poor shot, but I am an enthusiastic one."`],e:{comp:'odo',lore:'odo'}},
 m6a:{l:[`Odo: "The Reeve is still down there, under the bell. Forty years I knew him. If he is still in there, I want to hear it from him."`]},
 m6d:{l:[`The Reeve\'s staff splinters on the cobbles. The bell above you goes still, finally, mid-swing.`,`Odo kneels by the body a long while, lips moving.`],
  c:[{t:'Give him all the time he needs.',l:[`Odo: "Thank you. He was a hard man. He was kind, once. I think the kindness was the last thing to go."`],e:{bond:['odo',12],f:'odo_warm'}},
     {t:'Hurry him along. The Wood is next.',l:[`Odo gets up without a word and follows. He will not look at you for a while.`],e:{f:'odo_cold'}}]},
 arr_forest:{l:[`The trees are charcoal. Nothing has birds.`,`Pinned to a trunk with a rusted knife is a page torn from a ledger: LAMPLIGHTERS. NIGHT WATCH. DO NOT LET THE LAMP GO OUT.`],e:{page:1,lore:'lamplighters'}},
 m7d:{l:[`In a hollow log, a satchel, and a name burned into the leather: TAMSIN VEY.`,`Behind you a bowstring creaks.`,`Tamsin: "You scavenging my stash, or were you going to say hello?"`],
  c:[{t:'Hand it back. It is yours.',l:[`Tamsin lowers the bow a little. Tamsin: "Huh. Honest. That is a bad habit out here. I will take it, though."`],e:{comp:'tamsin',bond:['tamsin',10],f:'tamsin_trust'}},
     {t:'Offer to split it.',l:[`Tamsin: "Split it? You are either a fool or a raider." She grins. "Lucky for you I like both."`],e:{comp:'tamsin',f:'tamsin_split'}}]},
 m8d:{l:[`You cut a spool of loomsilk out of the dead web. It hums against your palm like a plucked string.`,`Mara runs it through her fingers and says nothing for a good minute.`,`Mara: "My grandmother wove with this. She said the first thread of the world was spider-silk. I thought it was a story."`]},
 m9a:{l:[`Mara: "A signal horn keeps blowing from the Works. Three short, one long. Miners\' code. Trapped. Alive. Go find them."`]},
 m9d:{l:[`Behind a collapsed shaft: three miners, grey-faced, alive. None of them will speak above a whisper.`,`Miner: "It listens. Whatever is down there, it listens. Do not make noise. Do not make a sound. Please."`]},
 m10a:{l:[`Mara: "Whatever is under the Works, it is why the horn blew. Put it down. Quietly, if you can."`]},
 m10d:{l:[`Where the Hush stood, a lantern lies in the dust. Old brass, tall as your forearm, the glass cracked, the wick cold.`,`Mara goes very pale. Mara: "That is a Lamplighter lantern."`],
  c:[{t:'Ask her what the Lamplighters were.',l:[
     `Mara: "I was an apprentice. They kept lamps lit in places the dark wanted. Every Rift you have seen, the first thing it ate was a lamp."`,
     `Mara: "Then they started to go out, one by one, and nobody could say why. I have been doing the ledger of what is left ever since."`],e:{f:'mara_told',lore:'lamplighters2'}},
    {t:'Say nothing. Hand her the lantern.',l:[`Mara takes it like it is a sleeping child. Mara: "Thank you. I will tell you someday. Not today."`],e:{f:'mara_quiet'}}],
  e:{it:{potion2:2},xp:60}},
 // ---- Act II
 m11a:{l:[`Mara: "The Barrens froze solid the night the first Rift opened. A Lamplighter outpost sat in the middle of it. If their lamp is still lit, it will be the only thing that is."`]},
 m11d:{l:[`The outpost is a half-buried tower, a single door locked with a Lamplighter seal. Frost has welded it shut.`],
  c:[{t:'Force the door. Time matters.',l:[`The seal screams and gives. Inside, the lamp is out. Whatever was in here is gone.`],e:{f:'outpost_force',it:{potion2:1}}},
     {t:'Thaw it slowly with fire.',l:[`It takes an hour, but the seal opens without breaking. The lamp inside is dark but whole. A note beside it: "Keep it lit."`],e:{f:'outpost_thaw',page:1,it:{ward:2}}}]},
 m12d:{l:[`Hoarfang\'s breath goes out. The snow falls straight for the first time since you arrived.`,`Mara, by lamp-light, back at camp: "The Barrens were hunting grounds. The Lamplighters stocked them. Somebody has to restock."`]},
 m13a:{l:[`Mara: "Rustyard. Somebody built a smelter there before the Breaking. Machines. Still running. Be careful of anything that hums."`]},
 arr_rustyard:{l:[`Rust-red hills of broken machines. A clang, then a click, then a polite, mechanical voice.`,`"Observation: you are alive. Observation: I am confused. Please advise."`]},
 m13d:{l:[`Under a collapsed crane: a bronze automaton, eyes dim, one arm missing, a Lamplighter sigil stamped on its chest.`,`Cog: "Designation: Lamp-Tender Nine. Directive: keep the lamp lit. Status: lamp is out. Observation: I do not know what to do now."`],
  c:[{t:'Take Cog with you. There is a lamp that needs tending.',l:[`Cog: "Observation: this is a better directive. Acknowledged. Thank you."`],e:{comp:'cog',bond:['cog',10],f:'cog_kind'}},
     {t:'Repair Cog first, then recruit it.',l:[`It takes an hour and half your oil. Cog flexes its new arm. Cog: "Observation: it is good to move."`],e:{comp:'cog',bond:['cog',6],f:'cog_repaired'}}]},
 m14d:{l:[`The Overseer\'s lamp dims. Behind it, an access plate falls open, revealing a fused core.`],
  c:[{t:'Salvage the core for parts.',l:[`The core still hums in your hand. Cog turns away.`],e:{f:'overseer_salvage',it:{cog:6,oil:4}}},
     {t:'Reboot it. Let it be a workshop again.',l:[`The Overseer\'s plates settle. Machines across the yard stir, and begin, slowly, to repair each other.`],e:{f:'overseer_reboot',bond:['cog',12],em:200}}]},
 m15a:{l:[`Mara: "The Sunken Quarter. A city that came through a Rift with its ocean. Somebody lives there. I know because they still ring the tide-bell at dusk."`]},
 arr_ruins:{l:[`The streets run straight down into black water. Somewhere below, a bell rings once.`,`A woman rows out of the dusk in a canoe made of door-frames. Ilsa: "You are late. The tide was due an hour ago."`]},
 m15d:{l:[`Ilsa leans on her oar and looks at you without blinking.`,`Ilsa: "My city drowned on a Thursday. I have been looking for someone who can tell the tide what to do ever since."`,`Ilsa: "You may have to do."`],e:{comp:'ilsa',lore:'ilsa'}},
 m16d:{l:[`The Drowned Lantern goes dark. For the first time in a long time the tide simply comes in and goes out.`,`Mara, by the fire, almost smiling: "Three lamps lit, or put to rest. The way to the Scar is open."`,`Mara: "I should tell you something about the Scar before you go. But not tonight. Rest."`],e:{lore:'actII_end'}},
 // ---- Act III
 m17a:{l:[`Mara: "The Cinder Fields are the way to the Scar. Something up there has been burning for a year. I want to know what."`]},
 arr_cinder:{l:[`Black earth, glass-smooth, warm underfoot. Every few steps something ticks as it cools.`]},
 m17d:{l:[`A man in cracked plate armor hangs from a gallows of fused slag, wrists chained, head bowed. The crest on his chest is a crown.`,`Kest: "Cut me down. Please. I will not run. I have nowhere to run to."`],
  c:[{t:'Cut him down. Ask questions after.',l:[`Kest drops to his knees and breathes for a minute. Kest: "I served the King. I want to serve the man he was. Take me."`],e:{comp:'kest',bond:['kest',10],f:'kest_freed'}},
     {t:'Question him first.',l:[`Kest, through his teeth: "His name was Alder. He saved my village once. He would not want you to hurt him, but he would want you to stop him. Both are true."`,`You cut him down.`],e:{comp:'kest',f:'kest_questioned'}}]},
 m18d:{l:[`You bring Mara a handful of ember cores. She puts them down, one by one, like chess pieces.`,`Mara: "The Hollow King on the Scar. He was a Lamplighter. His name was Alder. He was my brother."`,`Mara: "When the lamps began to go out, he made a crown to hold what they could not. He put it on to save us. I thought I could hear him in it for months."`,`Mara: "I need you to end it. I have needed someone to end it for a year. I have not been able to ask."`],e:{f:'knows_alder',lore:'alder'}},
 arr_scar:{l:[`The ground ends in a seam of red light. Heat pours out of it. Every step is a decision.`,`Kest, quietly: "It is not far to the throne. I will not fight him. I will stand beside you. That is all I can promise."`]},
 m20d:{l:[`The crown cracks. Alder collapses onto the throne, a man again for the length of one breath: grey, thin, younger than you expected.`,`Alder: "Mara\'s kid? No. Not Mara\'s. Who are you?" He looks past you at the Rift. "It is not finished. It is not finished with any of us."`],
  c:[{t:'End it. Mara asked.',l:[`You do it quickly. Alder\'s smile, as he goes, is the first kind thing the Scar has shown you.`],e:{f:'king_slain',lore:'b_hollow_king',echo:10}},
     {t:'Take the crown. It could be a weapon.',l:[`The crown is cold, then it is not. It does not fit you. It tries to.`,`Kest: "Put it down. Please. I watched him put it on."`],e:{f:'king_crown',it:{crown:1},echo:5}},
     {t:'Spare him. Carry him back to Mara.',l:[`Kest lifts Alder like a child. Alder does not fight. The Rift behind the throne closes, then opens again, wider, under your feet.`],e:{f:'king_spared',bond:['kest',20],echo:15}}]},
 // ---- Act IV
 m21a:{l:[`The floor of the Scar has opened. Below it, a flat grey fen that does not belong to any country. A way down.`]},
 arr_fen:{l:[`The fen is flat as glass for miles. Your reflection is a half-second late. Then, a full second.`,`In the water: faces. People you knew. People who never lived. Ilsa murmurs, "Do not look at them. They are not looking at you. They are looking through you."`]},
 m21d:{l:[`A pool as still as a mirror. A hand reaches out of it, and the hand is yours.`,`Your reflection, rising: "You know what you are, don\'t you? You have died more than once. You woke up each time with the same face. That is not luck. That is a lamp."`,`Reflection: "You are a Wick. You carry the light. Every death you relight. That is why the Quiet wants you."`],e:{f:'wick_told',lore:'wick'}},
 m22d:{l:[`The Reflection shatters. In every shard, for a moment, you are smiling back.`]},
 arr_choir:{l:[`Great vaulted halls of black stone. The walls hum a note you cannot place and cannot stop hearing.`,`Odo goes quiet. Odo: "Those are the Hamlet\'s hymns. That is my choir. Every one of them."`]},
 m23d:{l:[`Row on row of villagers sit in the pews, mouths open, singing, no breath behind it.`,`Odo, voice breaking: "Please. I cannot take them home. But I can stop the song."`],
  c:[{t:'Let Odo ring them out, one bell at a time.',l:[`He rings a bell in the old rhythm. One by one, the choir exhales and goes still, smiling.`],e:{f:'choir_freed',bond:['odo',20],echo:8}},
     {t:'Silence them. Quickly.',l:[`The hall falls silent in a hard breath. Odo does not forgive you for a while.`],e:{f:'choir_silenced',bond:['odo',-4]}}]},
 m24d:{l:[`The Choirmaster lowers his baton. The hall holds its note a heartbeat longer than anything should, and lets go.`]},
 arr_clock:{l:[`The air tastes of oil. The walls are gears, and they turn, and they never get anywhere.`,`Cog, in a low voice: "Observation: this is where I was built. Observation: I did not know until now."`]},
 m26d:{l:[`The Mainspring: a coil the size of a tower, wound far beyond what any spring should bear. Every clock in the Deep ticks in time with its beat.`,`Cog: "Directive conflict. Wind: preserve the world. Unwind: end the stoppage. I cannot choose. You must."`],
  c:[{t:'Unwind it. Time should move on.',l:[`The Mainspring sighs. Somewhere above, a clock strikes the hour for the first time in years. Cog stands very still, then very straight.`],e:{f:'spring_unwound',bond:['cog',16],echo:10}},
     {t:'Wind it. The world is safer held.',l:[`The Mainspring tightens. The ticking steadies. Cog turns away. Cog: "Observation: safe. Observation: not the same as free."`],e:{f:'spring_wound',bond:['cog',-4],echo:6}}]},
 // ---- Act V
 arr_glass:{l:[`Dunes of glittering glass. The light is brutal. The wind sings through a thousand shards.`,`A line of pilgrims in white, walking east, not looking at you.`]},
 m27d:{l:[`An old pilgrim lets you share her water.`,`Pilgrim: "We are walking to the Spire. Every lamp that went out, we ask forgiveness. It is a long walk. Somebody has to ask."`,`Pilgrim: "Do you know what the Lamplighters did? No? Neither do we. That is why we walk."`]},
 m28d:{l:[`The Colossus comes down in a rain of glittering gravel. The pilgrims, without a word, kneel and begin to sweep.`]},
 arr_spire:{l:[`Voidglass pillars rise out of nothing. Something tall and patient watches from the top.`]},
 m29d:{l:[`The Spire\'s lowest hall is an archive. Cabinets of ledgers, ranks of dead lamps, a single desk with a single chair.`,`On the desk, a journal, last entry still wet: WE OPENED THE DOOR ON PURPOSE. WE ONLY WANTED TO LOOK.`,`Mara, who has come this far and says nothing, finally: "I knew. I have always known. I could not say it out loud until somebody else read it."`],e:{f:'truth_known',lore:'truth',page:2}},
 m30d:{l:[`The wyrm comes down like a falling tower. The Spire goes quiet.`,`In the silence the Door opens, slowly, the way a mouth opens before it speaks.`,`Mara: "There is nothing I can tell you now that will help. Go. I will keep the fire."`],e:{lore:'b_ender_dragon'}},
 // ---- Act VI
 arr_shore:{l:[`Black sand, black water, a sky like a pupil. The tide comes in, goes out, comes in, and never touches the shore.`]},
 m31d:{l:[`The beach is covered in footprints. Every one is yours.`,`Lumen, pressed to your collar, flickers: *it knows you.*`]},
 end_scene:{l:[`The Quiet is not an enemy and it is not a god. It is what is left when everything else has stopped asking for something.`,`It does not speak. You hear, in your own voice: "You can keep me out, or let me in, or become me. Or you can ask what I wanted all along."`],
  c:[{t:'Relight. Seal the Door with your own light.',l:[`Light pours out of you and into the Door. It closes, slow and gentle as a held breath. You are still here, thinner, brighter. You will wake again.`],e:{f:'end_relight',echo:40,title:'Wick'}},
     {t:'Kindle. Take the Quiet into yourself.',l:[`You open your arms. The Quiet folds in, and you carry it. The sky is still the wrong color, but it is only a sky now.`],e:{f:'end_kindle',echo:40,title:'Hollowbearer'}},
     {t:'Open the Door. Listen to what it wanted.',l:[`You open the Door the rest of the way. What comes through is not a monster. It is a very old, very quiet question. You answer it.`],e:{f:'end_open',echo:40,title:'Doorkeeper'}},
     {t:'Ask all of them to stand with you.',if:'allComps',l:[`One by one, they come to stand beside you: Odo, Tamsin, Cog, Ilsa, Kest, and Lumen on your shoulder. The Quiet looks at the six lights and, for the first time in forever, does not look away.`,`The Door does not close and does not open. It simply becomes a doorway, and people walk through it, both ways, and it is not a wound any more.`],e:{f:'end_together',echo:80,title:'Lightbearer'}}]},
 // ---- companion quest scenes
 co1:{l:[`Odo, setting out a row of bones: "Chimes. For the dead. The old rite says a wind-chime keeps the lost from wandering. I am making a great many chimes."`]},
 co1d:{l:[`The chimes ring, thin and sweet, in the ash-wind. Odo: "There. Now at least they know the way home."`],e:{bond:['odo',20]}},
 co2d:{l:[`In the hamlet\'s oldest barn you find the founding bell, cracked but sound. Odo strikes it once and weeps.`,`Odo: "Thank you. I think I can ring it again."`],e:{bond:['odo',25]}},
 ta1d:{l:[`Tamsin, setting down her bow: "Six raiders. Six of my old crew. I would be lying if I said it felt like justice."`,`Tamsin: "It felt like paying a bill. Ready for the next one?"`],e:{bond:['tamsin',20]}},
 ta2d:{l:[`Tamsin traces a rune on the stock of her bow. Tamsin: "I taught myself to read just to know what that said. It says: aim true. That is all. Twenty years of running, and the last thing a stranger told me was that."`],e:{bond:['tamsin',25]}},
 cg1d:{l:[`Cog drinks the oil with solemn care. Cog: "Observation: lubrication is a form of kindness."`],e:{bond:['cog',20]}},
 cg2d:{l:[`Deep in the Rustyard, a lamp shell the size of a coffin. Cog kneels. Cog: "Ninth Lamp. My Lamp. Observation: it is empty. Observation: I am not."`],e:{bond:['cog',25]}},
 il1d:{l:[`Ilsa pours salt into the black water, slowly, one fistful at a time.`,`Ilsa: "For every house the sea took. It does not bring them back. It does let them rest."`],e:{bond:['ilsa',20]}},
 il2d:{l:[`The drowned bells fall silent. Ilsa lets out a breath that sounds like a wave going out.`,`Ilsa: "Thank you. For the bells. For the quiet. I have been asking the tide to listen for years."`],e:{bond:['ilsa',25]}},
 ke1d:{l:[`Kest cleans his sword slowly. Kest: "The Hollow Knights were my brothers-in-arms. I wanted to be the one to end them. I was not strong enough to do it alone."`],e:{bond:['kest',20]}},
 ke2d:{l:[`On the Scar\'s edge, a sword stuck in the black glass. Alder\'s. Kest takes it, wipes the blade, and for a moment looks young.`,`Kest: "I will carry it, until somebody better comes along."`],e:{bond:['kest',25]}},
 lu1d:{l:[`Lumen drinks the ember core\'s warmth and brightens until the whole tent glows.`,`*it likes the taste*, you decide, with no way to be sure.`],e:{bond:['lumen',20]}},
 lu2d:{l:[`Lumen drifts up the Spire\'s side, round and round, until it is a tiny bright spiral of light. It comes back, lands on your sleeve, and stays.`],e:{bond:['lumen',25]}}
};

const LORE=[
 ['mara','Mara','Mara keeps Ember Camp alive with a kettle, a ledger, and a stare that sorts people into useful and not yet useful. She will not say what she did before.'],
 ['bran','Bran','Bran the smith has hands like shovels and a touch like a watchmaker. He never says where he learned.'],
 ['odo','Brother Odo','Odo rang the bell in the Quiet Hamlet the day the villagers walked out singing. He has been trying to forgive himself since.'],
 ['ilsa','Ilsa','Ilsa rows through her drowned city at dusk, ringing the tide-bell for people who are no longer there to hear it.'],
 ['lamplighters','The Lamplighters','An old order that kept great lamps lit in places the dark wanted. They had a motto: do not let the lamp go out.'],
 ['lamplighters2','What Mara Knew','Mara was a Lamplighter apprentice. Every Rift she has seen ate a lamp first.'],
 ['alder','Alder','Alder was a Lamplighter, and Mara\'s brother. When the lamps began to go out, he made the Hollow Crown and put it on to save the camp. It saved them. It did not save him.'],
 ['wick','The Wick','You are a Wick: someone who carries light, and relights after death. It is why the Quiet wants you, and why you keep waking.'],
 ['truth','What They Did','The Lamplighters did not save the world from the dark. They opened the Door on purpose, to look at it. The dark noticed.'],
 ['actII_end','Three Lamps','Hoarfang\'s Outpost, the Overseer\'s Yard, the Drowned Lantern: three old lamps, now dark or at peace. The way to the Scar is open.'],
 ['z_plains','Ashen Flats','The first Rift opened here. The ground never closed.'],
 ['z_village','Quiet Hamlet','The villagers did not die. They left through the Rift, all together, singing. Their bell is still swinging.'],
 ['z_forest','Ghostwood','Trees do not die this way. Something drank them from the roots, patiently, one ring at a time.'],
 ['z_mines','Deep Works','The crews dug until the walls started answering. Their lamps are still lit somewhere below.'],
 ['z_tundra','Rime Barrens','The Rift here opened on a world that was already cold, and brought it along.'],
 ['z_rustyard','Rustyard','Machines that were built to look after the lamps, and went on looking after nothing.'],
 ['z_ruins','Sunken Quarter','A city came through the Rift with its ocean attached. The streets are still wet.'],
 ['z_cinder','Cinder Fields','Everything here was once green. The black glass underfoot is the ghost of fields.'],
 ['z_scar','The Scar','The first Rift tore here. The wound never healed. Whoever sits beyond it is not trapped. He is waiting.'],
 ['z_fen','Mirror Fen','The water shows you what you would have done. It is always worse than what you did.'],
 ['z_choir','Choir Halls','The Hamlet\'s dead sing here, forever, for whatever sits at the end of the hall.'],
 ['z_clock','Clockwork Deep','The engine that made time possible, and then made it stop.'],
 ['z_glass','Glass Desert','Pilgrims walk east in white, asking forgiveness of a tower that cannot hear.'],
 ['z_spire','Lastlight Spire','The tower where the Lamplighters kept the last lamp, and where they opened the Door.'],
 ['z_shore','The Starless Shore','The place beyond the Door. The tide never decides.'],
 ['b_tusk_mother','The Tusk-Mother','She was only a boar. The Quiet made her angry enough to be a threat.'],
 ['b_hollow_reeve','The Hollow Reeve','A town headman, emptied. Odo says he used to be kind.'],
 ['b_mother_loom','Mother Loom','She wove the Wood into a net. She was only trying to keep it from falling.'],
 ['b_warden','The Hush','It did not hunt you. It listened for you. The Works are quiet now.'],
 ['b_hoarfang','Hoarfang','A wolf the size of a house, hunting alone because everything else was gone.'],
 ['b_overseer','The Overseer','A machine that kept running because it was never told it could stop.'],
 ['b_ancient_guardian','The Drowned Lantern','Its lamp was a lighthouse once. It was built to watch for the thing that was coming, not for ships.'],
 ['b_cinder_maw','The Cinder Maw','What is left of a field that was starving for years, now starving still.'],
 ['b_hollow_king','The Hollow King','He was the first through the Rift and the first to put the crown on. He was Mara\'s brother.'],
 ['b_reflection','The Reflection','It was you, at your most honest.'],
 ['b_choirmaster','The Choirmaster','A man who loved music more than anything, and was emptied of everything but music.'],
 ['b_mainspring','The Mainspring','A coil wound beyond reason, holding the whole world to a single, endless afternoon.'],
 ['b_sandglass','The Sandglass Colossus','What the desert becomes when it decides to remember being an hourglass.'],
 ['b_ender_dragon','The Lastlight Wyrm','It was not the enemy. It was the last door, and it asked you for a reason.'],
 ['b_quiet','The Quiet Between','The Quiet is what is left when everything else has stopped asking for something.'],
 ['rebirth','Echoes','You died, or something like it, and woke at the camp with the kettle on and Mara handing you a bowl. Echoes are what stay behind.'],
 ['end_relight','Ending: Relight','You sealed the Door with your own light. The world is held, and you will wake again.'],
 ['end_kindle','Ending: Kindle','You took the Quiet into yourself. The world heals around a wound only you can feel.'],
 ['end_open','Ending: Open the Door','You listened. The Quiet had been asking a question for a long, long time.'],
 ['end_together','Ending: Together','Six lights and a Wick stood at the Door. It became a doorway, and the world walked through, both ways.']
];

 `Entry, the Barrens. Cold beyond what the wool can bear. The lamp here is small. I am not sure it is enough.`,

const TALK={
 mara:{1:[`Mara: "Eat. Count your rounds. Count them twice."`,`Mara: "The ledger says we have four days of bread. The ledger is optimistic."`,`Mara: "Bring back what you can. Bring yourself back first."`],
       2:[`Mara: "Hoarfang, Overseer, the Lantern. Three old names. Three old lamps. I knew the people who tended them."`,`Mara: "The Lamplighters were careful. That is what scares me. They were careful, and still."`],
       3:[`Mara: "My brother used to hum when he was thinking. I had forgotten that. I heard it in my sleep last night."`,`Mara: "The Scar is close. I do not like how much I am looking forward to it being over."`],
       4:[`Mara: "You came back with a Reflection in your eyes. It will pass. Mine took ten years."`,`Mara: "The Choir was a good one. Alder loved a choir."`],
       5:[`Mara: "The pilgrims are walking to the Spire. Somebody should tell them it is not a shrine."`,`Mara: "I read the last journal entry. I should have asked more questions years ago."`],
       6:[`Mara: "Whatever you decide beyond the Door, I will keep the fire. That is the one thing I am sure of."`,`Mara: "I count the food, the beds, and the dead. I should start counting the living."`]},
 bran:{1:[`Bran: "Bring me iron and I will make you something that does not break. Everything breaks, but slower."`],

       3:[`Bran: "Ember cores. Voidglass. You are bringing me the things dreams are made of, and I am ruining them with a hammer."`],
       4:[`Bran: "Mirror shards. They fight me every blow. Good. I respect that."`],
       5:[`Bran: "Sunglass. I did not know glass could be an edge. I am learning."`],
       6:[`Bran: "The best thing I have ever made is a nail. Everything else was just practice."`]},
 odo:{1:[`Odo: "The trouble with faith is it asks for so much patience. The trouble with doubt is it asks for so much more."`,`Odo: "I will bandage you or I will pray over you. Whichever you need less of."`],
      2:[`Odo: "The Wood was kind, in its way. It let me sleep."`],
      3:[`Odo: "Alder was a good man. I have been telling myself that. It helps."`],
      4:[`Odo: "The choir. My choir. I think if I hum, they may hear."`],
      5:[`Odo: "The pilgrims remind me of the Hamlet. All of them walking, all of them certain."`],
      6:[`Odo: "Whatever you choose, I will ring a bell for it. That is what I am good for."`]},
 tamsin:{1:[`Tamsin: "I was a raider. I am a reformed raider. The distinction is mostly about whose camp I eat at."`],
         2:[`Tamsin: "Cold makes my bow-hand ache. Warm it up, and I will shoot anything you point at."`],
         3:[`Tamsin: "You ever notice that every Lamplighter ruin has a good vantage point? Smart people. Terrible at survival."`],
         4:[`Tamsin: "The fen shows me my old crew. I wave. They do not wave back."`],
         5:[`Tamsin: "Pilgrims, glass, sun. I hate everything about this, and I am having the best time."`],
         6:[`Tamsin: "End of the world. Shame I only just got good at the bow."`]},
 cog:{1:[`Cog: "Observation: you are alive. Observation: this is pleasing."`],
      2:[`Cog: "Observation: this one is cold. Do you require my heat? I have some. Not much."`],
      3:[`Cog: "Observation: the Lamplighters made me to tend a flame. The flame is out. I am recalibrating."`],
      4:[`Cog: "Observation: I have been counting the ticks of the Deep. They are not lying. They are just not helping."`],

 ilsa:{1:[`Ilsa: "The sea sings to those who listen. It is mostly just humming."`],

 kest:{1:[`Kest: "I am sworn to a man who is not here. I am learning what that means."`],

const slotOf=i=>GEAR[i.b].slot, tierOf=i=>GEAR[i.b].tier;
const eqi=s=>g.eq[s]?g.gear.find(x=>x.u===g.eq[s])||null:null;
const gById=u=>g.gear.find(x=>x.u===u);
function gstat(i){
  const B=GEAR[i.b],m=RM[i.r]*(1+.07*i.e);
  const o={atk:Math.round(B.atk*m),def:Math.round(B.def*m),hp:Math.round(B.hp*m)};
  for(const [k,v] of i.af)o[k]=(o[k]||0)+v;
  return o;
}
function gname(i){
  const base=i.rl?RLD[i.rl].n:(i.r?RAR[i.r]+' ':'')+GEAR[i.b].n;
  return base+(i.e?' +'+i.e:'');
}
const affTxt=([k,v])=>AFF[k].n+' +'+v+(AFF[k].p?'%':'');
function gtxt(i){
  const o=gstat(i),p=[];
  if(o.atk)p.push('+'+o.atk+' ATK');
  if(o.def)p.push('+'+o.def+' DEF');
  if(o.hp)p.push('+'+o.hp+' HP');
  for(const k in o){if(k!=='atk'&&k!=='def'&&k!=='hp'&&AFF[k])p.push(AFF[k].n+' +'+(Math.round(o[k]*10)/10)+(AFF[k].p?'%':''));}
  return p.join(' · ');
}
function gtxtBase(i){ // base stats only + affix count
  const o=gstat(i),p=[];
  if(o.atk)p.push('+'+o.atk+' ATK');if(o.def)p.push('+'+o.def+' DEF');if(o.hp)p.push('+'+o.hp+' HP');
  const af=i.af.filter(a=>a[0]!=='atk'&&a[0]!=='def'&&a[0]!=='hp');
  return p.join(' ')+(af.length?'  ·  '+af.map(affTxt).join(', '):'');
}
function rollAff(i,keep){
  const slot=slotOf(i),t=tierOf(i);
  const n=[0,1,2,3,4][i.r];
  const keys=AFFK.filter(k=>AFF[k].s.indexOf(slot)>=0);
  const af=[];
  while(af.length<n&&keys.length){
    const k=keys.splice(Math.floor(rnd()*keys.length),1)[0],[lo,hi]=AFF[k].f(t);
    const u=Math.min(1,rnd()*.75+i.r*.07);
    let v=lo+(hi-lo)*u;v=AFF[k].i?Math.round(v):Math.round(v*10)/10;
    af.push([k,v]);
  }
  i.af=af;
}
function mkGear(slot,tier,r,rl){
  const i={u:g.uid++,b:slot+tier,r:r,e:0,af:[],lk:0};
  if(rl){i.rl=rl.id;i.r=4;i.af=rl.a.map(x=>[x[0],x[1]]);i.lk=1;}
  else rollAff(i);
  return i;
}
const tierFor=L=>{let t=1;TIERS.forEach((T,i)=>{if(L>=T.L)t=i+1;});return t;};
function rollRar(w){return wpick(w.map((x,i)=>[i,x]));}
const RAR_W={n:[62,26,9.5,2.5],e:[38,34,21,7],b:[0,28,50,22],d:[30,35,26,9]};
function dropGear(L,mode,minr){
  let t=tierFor(L);const x=rnd();
  if(x<.22&&t>1)t--;else if(x>.92&&t<10)t++;
  let r=rollRar(RAR_W[mode||'n']);if(minr!=null)r=Math.max(r,minr);
  return mkGear(pick(SLOTS),t,r);
}
const gval=i=>Math.max(1,Math.round(GEAR[i.b].v*RVAL[i.r]*(1+.2*i.e)*.14*(1+sellPct()/100)));
function addGear(i,quiet){
  if(g.as>=0&&i.r<=g.as&&!i.lk&&!i.rl){const v=gval(i);g.em+=v;if(!quiet)say('Auto-sold '+gname(i)+' for '+v+' scrip.','sys');return null;}
  if(g.gear.length>=90){
    const junk=g.gear.filter(x=>!x.lk&&g.eq[slotOf(x)]!==x.u).sort((a,b)=>gval(a)-gval(b))[0];
    if(junk&&gval(junk)<gval(i)){g.em+=gval(junk);g.gear.splice(g.gear.indexOf(junk),1);say('Pack full. Sold '+gname(junk)+'.','sys');}
    else{g.em+=gval(i);say('Pack full. Sold '+gname(i)+'.','sys');return null;}
  }
  g.gear.push(i);return i;
}
function equipG(i){g.eq[slotOf(i)]=i.u;const m=calc().hp;if(g.hp>m)g.hp=m;}

/* ---------- stats ---------- */
const bm=n=>g.buff[n]?g.buff[n].m:1;
const BSD={};BLESS.forEach(b=>{BSD[b.id]=b;});
const sellPct=()=>{let s=3*U('hag')+3*(g.sk.s3||0)+(bl('market')>=2?2:0);return s;};
function calc(){
  const S={},add=(k,v)=>{S[k]=(S[k]||0)+v;};
  let ga=0,gd=0,gh=0;
  for(const s of SLOTS){const i=eqi(s);if(!i)continue;const o=gstat(i);ga+=o.atk||0;gd+=o.def||0;gh+=o.hp||0;for(const k in o)if(k!=='atk'&&k!=='def'&&k!=='hp')add(k,o[k]);}
  for(const s of SKILLS){const r=g.sk[s.id]||0;if(r&&s.s)for(const k in s.s)add(k,s.s[k]*r);}
  if(g.bless)for(const k in BSD[g.bless.id].s)add(k,BSD[g.bless.id].s[k]);
  {const pb=2*Math.floor(pageCount()/6);add('patk',pb);add('pdef',pb);}
  if(g.fl.bg_sold)add('patk',5);if(g.fl.bg_scav)add('loot',8);if(g.fl.bg_schol)add('xp',8);
  const L=g.lvl,o={};
  o.atk=Math.round((4+L*1.1+ga)*(1+((S.patk||0)+3*U('sharp')+3*X('might'))/100)*bm('rage'));
  o.def=Math.round((1+L*.55+gd)*(1+((S.pdef||0)+3*U('plate')+3*X('guard'))/100)*bm('ward'));
  o.hp=Math.round((50+L*9+gh)*(1+((S.php||0)+4*U('vit')+4*X('hide'))/100));
  o.crit=clamp(5+(S.crit||0)+X('crit'),0,75);
  o.critd=50+(S.critd||0);
  o.dodge=clamp((S.dodge||0)+(compOn('lumen')?bondRank('lumen'):0),0,45);
  o.ls=clamp(S.ls||0,0,25);
  o.thorn=S.thorn||0;
  o.fgain=10+(S.focus||0);
  o.xp=(S.xp||0)+8*X('learn')+3*bl('library');
  o.em=(S.em||0)+8*X('gold');
  o.loot=(S.loot||0)+4*X('find')+3*U('scav')+3*bl('tower');
  o.regen=S.regen||0;
  o.heal=S.heal||0;
  o.food=clamp((S.food||0)+7*U('gut'),0,70);
  o.sell=sellPct();
  o.buy=clamp(2*U('hag')+3*(g.sk.s3||0)+3*bl('market'),0,60);
  o.qf=S.qf||0;o.bl=S.bl||0;o.stal=S.stal||0;o.unb=S.unb||0;
  return o;
}
const maxHp=()=>calc().hp;
const sp=()=>({tot:Math.max(0,g.lvl-1)+2*X('sp'),used:Object.values(g.sk).reduce((a,b)=>a+b,0)});
const brPts=b=>SKILLS.filter(s=>s.b===b).reduce((a,s)=>a+(g.sk[s.id]||0),0);
function skillAvail(s){return (!s.rq||brPts(s.b)-(g.sk[s.id]||0)>=s.rq);}
const price=id=>Math.max(1,Math.round(ITEMS[id].v*2*(1-calc().buy/100)));
const sellVal=(id,n)=>Math.max(1,Math.round(ITEMS[id].v*n*.9*(1+sellPct()/100)));

/* ---------- time, hunger, xp, hp ---------- */
const phase=()=>Math.floor(g.t/3)%8;
const isNight=()=>phase()>=6;
function newDay(){
  g.day=1+Math.floor(g.t/24);
  g.wx=wpick([[0,48],[1,22],[2,18],[3,12]]);
  say('Day '+g.day+' · '+WX[g.wx][0]+'. '+WX[g.wx][1],'day');
}
function tick(ticks,fc){
  const d0=g.day;g.t+=ticks;
  if(1+Math.floor(g.t/24)!==d0)newDay();
  let c=fc==null?ticks*1.3:fc;
  c*=(1-calc().food/100)*(g.wx===3?1.4:1)*(isNight()?1.1:1);
  g.food=Math.max(0,g.food-pround(c));
  if(g.food===0){
    const d=Math.max(2,Math.round(maxHp()*.03));
    if(g.hp>1){g.hp=Math.max(1,g.hp-d);say('Starving. You lose '+d+' HP.','hit');}
  }else if(g.food<=20&&!g.fl.warned){g.fl.warned=1;say('Your stomach is cramping. You need food.','sys');}
  if(g.food>20)delete g.fl.warned;
}
function heal(n){const m=maxHp();const b=g.hp;g.hp=Math.min(m,g.hp+Math.max(0,Math.round(n)));return g.hp-b;}
function gainXp(n){
  n=Math.round(n*(1+calc().xp/100));g.xp+=n;let up=0;
  while(g.lvl<99&&g.xp>=need(g.lvl)){g.xp-=need(g.lvl);g.lvl++;up++;}
  if(g.lvl>=99)g.xp=Math.min(g.xp,need(98));
  if(up){heal(maxHp()*.25);say('Level '+g.lvl+'. You stand a little steadier. (+'+up+' skill point'+(up>1?'s':'')+')','lvl');}
  return n;
}
function gainEm(n){n=Math.round(n);g.em+=n;return n;}
function lvlFx(pl,el_){ // xp/scrip falloff when far above the enemy
  const d=pl-el_;return d>3?Math.max(.12,1-.1*(d-3)):d<0?Math.min(1.5,1-.06*d):1;
}
const damp=L=>L<8?.55+.056*L:1, lt=L=>clamp((L-10)/40,0,1);
const ehp=L=>(18+8*L+.5*L*L)*damp(L)*(1+1.2*lt(L)), eatk=L=>(5+2.4*L+.03*L*L)*damp(L)*(1+1.5*lt(L)), edef=L=>(1+1.0*L)*damp(L);
const xpOf=L=>5+1.5*L+.2*L*L, emOf=L=>(2+.9*L+.07*L*L)*.7;
const rs=()=>({h:1+.5*g.re,a:1+.2*g.re,d:1+.12*g.re,r:1+.4*g.re});

/* ---------- save / load / migrate ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(g));}catch(e){}}
function norm(o){ // fill missing fields so a loaded save always has every key
  const f=fresh(),r=Object.assign(f,o);
  ['comp','stats','ls'].forEach(k=>{r[k]=Object.assign(f[k],o[k]||{});});
  r.comp.have=r.comp.have||{};r.comp.act=r.comp.act||[];r.comp.bond=r.comp.bond||{};
  return r;
}
function load(){
  try{
    const s=localStorage.getItem(KEY);
    if(s){const o=JSON.parse(s);if(o&&o.v===4)return norm(o);}
  }catch(e){}
  try{
    const s=localStorage.getItem(OLDKEY);
    if(s){const o=JSON.parse(s);if(o&&o.v===1)return migrate(o);}
  }catch(e){}
  return null;
}
function migrate(o){
  const n=fresh();
  n.lvl=Math.max(1,o.lvl|0);n.xp=o.xp|0;n.em=o.em|0;n.re=o.re|0;n.ech=o.ech|0;
  n.eu=o.eu||{};n.up=o.up||{};n.lore=Object.assign({},o.lore||{});
  n.kills=o.kills||{};n.stats.kills=Object.values(n.kills).reduce((a,b)=>a+b,0);
  ['warden','ancient_guardian','hollow_king','ender_dragon'].forEach(b=>{if(o.bd&&o.bd[b])n.bdAll[b]=1;});
  n.food=clamp(o.food|0,30,100);
  n.inv={};
  for(const id in (o.inv||{})){
    if(LEGACY[id]){ // old weapon/armor -> gear instance
      const b=GEAR[LEGACY[id]];const it={u:n.uid++,b:b.id,r:0,e:0,af:[],lk:0};n.gear.push(it);
      if(o.eq&&(o.eq.w===id||o.eq.a===id))n.eq[b.slot]=it.u;
    }else if(ITEMS[id]&&(ITEMS[id].t!=='weapon'&&ITEMS[id].t!=='armor'))n.inv[id]=o.inv[id];
  }
  if(!n.gear.some(x=>slotOf2(x)==='w')){const it={u:n.uid++,b:'w1',r:0,e:0,af:[],lk:0};n.gear.push(it);n.eq.w=it.u;}
  if(!n.eq.w){const w=n.gear.find(x=>slotOf2(x)==='w');if(w)n.eq.w=w.u;}
  n.log=[['Your old save was carried over: level, upgrades, echoes and items came with you. The story begins again.','sys']];
  n.fl.migrated=1;
  g=n;n.hp=maxHp();
  return n;
}
const slotOf2=i=>GEAR[i.b].slot;

/* ================= COMBAT ================= */
const fnm=(f,cap)=>f.boss?f.n:(cap?'The ':'the ')+(f.el?'elite ':'')+f.n;
const trList=f=>Object.keys(f.tr).filter(t=>TRAITN[t]).map(t=>TRAITN[t]);

function mkFoe(id,L,o){
  o=o||{};
  const B=BOSSES[id],M=B||MOBS[id],ro=ROLES[M.r],s=rs();
  const f={id:id,n:M.n,L:L,boss:B?1:0,el:o.el?1:0,t:0,tr:{},fz:0,mark:0,markv:0,bleed:[],stun:0,fuse:0,ph:0};
  let h=ehp(L)*ro[0],a=eatk(L)*ro[1],d=edef(L)*ro[2];
  if(B){h*=B.hpm;a*=B.am;d*=B.dm;}
  if(f.el){h*=1.8;a*=1.25;d*=1.2;}
  h*=s.h;a*=s.a;d*=s.d;
  if(o.mult){h*=o.mult;a*=1+.45*(o.mult-1);d*=1+.2*(o.mult-1);f.trial=o.trial;}
  (M.tr||[]).forEach(t=>{f.tr[t]=1;});
  if(f.el){const n=R(1,2);for(let i=0;i<n;i++)f.tr[pick(ELITE_TR)]=1;}
  if(f.tr.armored)d*=1.4;
  if(f.tr.heavy)a*=1.25;
  if(B&&B.mirror){const S=calc();a=Math.max(a,S.atk*.85);d=Math.max(d,S.def*.7);}
  f.max=f.hp=Math.round(h);f.atk=a;f.def=d;
  return f;
}
function startFight(f,o){
  o=o||{};
  const M=f.boss?BOSSES[f.id]:MOBS[f.id];
  f.p={fc:Math.min(100,10*X('focus')+(g.rf>0?25:0)),brace:0,rip:0,sil:0,ub:calc().unb};
  if(g.rf>0)g.rf--;
  g.fight=f;g.view='fight';g.st={};
  say((f.el?'Elite! ':'')+(M.intro||('A '+f.n+' lurches out of the haze.')),'hit');
  if(f.el){const t=trList(f);if(t.length)say('It is '+t.join(' and ').toLowerCase()+'.','sys');}
  if(f.boss)say(f.n+' is far stronger than anything you have fought. Guard when it telegraphs.','sys');
  if(o.ambush){say('It strikes first!','hit');foeAct(false);if(g.fight)postWarn();}
  else postWarn();
}
function warnNext(f){
  if(!f.boss)return f.tr.fuse&&f.fuse>=2?'It is about to blow. Guard or kill it now.':'';
  const B=BOSSES[f.id];
  for(const p of B.pats)if(p.w&&(f.t+1)%p.e===0)return p.w;
  return '';
}
function postWarn(){const f=g.fight;if(!f)return;const w=warnNext(f);if(w)say(w,'hit');}

/* ---- damage helpers ---- */
function die(){
  const lost=Math.floor(g.em*.2);g.em-=lost;g.fight=null;ev=null;g.scene=null;
  g.loc='camp';g.view='main';g.buff={};g.st={};g.stats.deaths++;
  if(g.delve){say('The delve closes behind you.','sys');g.delve=null;}
  g.hp=Math.ceil(maxHp()*.6);g.food=Math.max(g.food,40);UI.auto=false;UI.hunt=false;
  say('You go down. The ash closes over you. You wake at Ember Camp, '+lost+' scrip lighter.','hit');
}
function hurt(d,msg,cls){
  g.hp-=d;say(msg+' (-'+d+' HP)',cls||'hit');
  if(g.hp>0)return false;
  const f=g.fight;
  if(f&&f.p.ub>0){f.p.ub--;g.hp=1;say('You refuse to fall. Unbroken! (1 HP)','lvl');return false;}
  if(have('totem')){take('totem');g.hp=Math.ceil(maxHp()*.5);say('The Ember Charm burns out and drags you back. (HP '+g.hp+')','lvl');return false;}
  die();return true;
}
function incoming(a,o,gd){
  const S=calc(),f=g.fight;
  if(!o.nd&&rnd()*100<S.dodge)return 0;
  const D=S.def*(1-(o.pierce||0));
  let d=a*a/(a+D)*rf(.92,1.08);
  if(gd)d*=clamp(.5-S.stal/100,.2,.5);
  if(f.p.brace>0)d*=1-(.4+.1*f.p.brace);
  if(compOn('cog'))d*=1-(10+3*bondRank('cog'))/100;
  return Math.max(1,Math.round(d));
}
const foeAtk=f=>f.atk*(f.tr.frenzy?1+.08*Math.min(f.fz,7):1);
function foeHit(f,mult,o,gd,msg){ // returns true if player died
  o=o||{};
  const d=incoming(foeAtk(f)*mult,o,gd);
  if(d===0){say(fnm(f,1)+' misses. You slip aside.','sys');return false;}
  if(hurt(d,msg+(gd?' (guarded)':'')+'.'))return true;
  if(f.hp>0&&f.tr.drain){const h=Math.round(d*.4);f.hp=Math.min(f.max,f.hp+h);}
  if(!o.notr){
    if(f.tr.poison&&!g.st.poison&&rnd()<.45){g.st.poison={d:Math.max(1,Math.round(foeAtk(f)*.1)),t:4};say('You are poisoned.','hit');}
    if(f.tr.burn&&!g.st.burn&&rnd()<.4){g.st.burn={d:Math.max(1,Math.round(foeAtk(f)*.13)),t:3};say('You catch fire.','hit');}
  }
  const S=calc();
  if(S.thorn&&f.hp>0){const th=Math.max(1,Math.round(d*S.thorn/100));f.hp-=th;}
  return false;
}
function hitFoe(mult,o){ // returns damage dealt (0 on miss)
  o=o||{};
  const f=g.fight,S=calc(),P=f.p;
  if(f.tr.evasive&&!o.sure&&rnd()<.15){say('You swing at '+fnm(f)+' but it slips aside.','sys');return 0;}
  const a=S.atk*mult,d0=o.pierce?0:f.def;
  let dmg=a*a/(a+d0)*rf(.92,1.08);
  if(f.mark>0)dmg*=1+f.markv/100;
  const crit=!!o.crit||rnd()*100<S.crit;
  if(crit)dmg*=1+S.critd/100;
  dmg=Math.max(1,Math.round(dmg));
  f.hp-=dmg;
  if(!o.quiet)say((o.tag||'')+(crit?'Critical! ':'')+(o.by?o.by+' hits ':'You hit ')+fnm(f)+' for '+dmg+'.','story');
  if(S.ls)heal(dmg*S.ls/100);
  if(!o.nf)P.fc=Math.min(100,P.fc+S.fgain);
  if(f.tr.thorns&&!o.pierce){const th=Math.max(1,Math.round(dmg*.08));if(hurt(th,'Its spines cut you','hit'))return -1;}
  return dmg;
}

/* ---- rounds ---- */
function turn(actionFn){
  const f=g.fight;if(!f)return;
  let gd=false;
  if(g.st.stun>0){g.st.stun--;say('You are stunned and cannot act!','hit');}
  else{
    const r=actionFn();if(r===-1||!g.fight)return;
    gd=!!r;
  }
  if(!g.fight)return;
  if(f.hp<=0){win();return;}
  round(gd);
}
function round(gd){
  const f=g.fight;f.t++;
  if(f.tr.frenzy)f.fz++;
  for(const b of f.bleed){f.hp-=b.d;b.t--;}
  if(f.bleed.length)say(fnm(f,1)+' bleeds.','sys');
  f.bleed=f.bleed.filter(b=>b.t>0);
  if(f.tr.regen&&f.hp>0)f.hp=Math.min(f.max,f.hp+Math.round(f.max*.025));
  if(f.hp<=0){win();return;}
  compTurn(gd);
  if(!g.fight)return;
  if(f.hp<=0){win();return;}
  foeAct(gd);
  if(!g.fight)return;
  if(f.p.rip>0&&f.hp>0){hitFoe(.7+.2*f.p.rip,{nf:1,tag:'Riposte! '});f.p.rip=0;if(!g.fight)return;if(f.hp<=0){win();return;}}
  f.p.brace=0;
  playerTick();
  if(g.fight)postWarn();
}
function compTurn(gd){
  const f=g.fight,S=calc();
  for(const c of g.comp.act){
    const r=bondRank(c);
    if(c==='odo'&&f.t%3===0){const h=heal(maxHp()*(.03+.012*r));if(h>0)say('Odo mends you. (+'+h+' HP)','win');}
    else if(c==='tamsin'){hitFoe(.22+.05*r,{pierce:1,nf:1,by:'Tamsin',tag:'An arrow. '});}
    else if(c==='ilsa'){f.mark=Math.max(f.mark,2);f.markv=Math.max(f.markv,6+2*r);}
    else if(c==='kest'&&gd){hitFoe(.8+.15*r,{nf:1,by:'Kest',tag:'Counter! '});}
    else if(c==='lumen'){f.p.fc=Math.min(100,f.p.fc+2+r);}
    if(!g.fight||f.hp<=0)return;
  }
}
function foeAct(gd){
  const f=g.fight,B=f.boss?BOSSES[f.id]:null,M=B||MOBS[f.id];
  if(f.stun>0){f.stun--;say(fnm(f,1)+' is stunned and does nothing.','sys');return;}
  if(B){
    const pct=f.hp/f.max;
    if(f.ph<1&&pct<=.66){f.ph=1;f.atk*=1.1;say(B.ph[0],'hit');}
    if(f.ph<2&&pct<=.33){f.ph=2;f.atk*=1.12;say(B.ph[1],'hit');}
  }
  if(f.tr.fuse){
    f.fuse++;
    if(f.fuse===1){say(fnm(f,1)+' hisses. Its fuse is lit.','hit');return;}
    if(f.fuse===2){say(fnm(f,1)+' swells. It blows next turn. Guard or kill it now.','hit');return;}
    const d=incoming(f.atk*(M.boom||3),{pierce:.3,nd:1},gd);
    g.fight=null;g.view=g.delve?'delve':'main';g.st={};
    if(!hurt(d,fnm(f,1)+' detonates'+(gd?'; your guard takes the worst of it':'')+'.')&&g.delve)g.view='delve';
    return;
  }
  if(compOn('cog')&&rnd()<.06+.02*bondRank('cog')){say('Cog steps in front of the blow and shrugs it off.','sys');return;}
  const pat=B?B.pats.find(p=>f.t%p.e===0):null;
  if(pat){special(f,pat,gd);return;}
  if(foeHit(f,1,{},gd,fnm(f,1)+' '+(M.hv||'attacks you')))return;
  if(f.tr.swift&&g.fight&&f.hp>0&&rnd()<.3)foeHit(f,.6,{notr:1},gd,fnm(f,1)+' strikes again');
}
function special(f,p,gd){
  const kind=p.k,m=p.m;
  const heavy={sonic:1,beam:.5,breath:.35};
  if(heavy[kind]!=null){foeHit(f,p.d,{pierce:heavy[kind]},gd,m);return;}
  if(kind==='multi'){for(let i=0;i<3;i++){if(!g.fight||foeHit(f,p.d,{},gd,m))return;}return;}
  if(kind==='drain'){
    const d=incoming(foeAtk(f)*p.d,{},gd);
    if(d===0){say(m+', but you slip aside.','sys');return;}
    f.hp=Math.min(f.max,f.hp+Math.round(d*.9));hurt(d,m+(gd?' (guarded)':''));return;
  }
  if(kind==='summon'){f.hp=Math.min(f.max,f.hp+Math.round(f.max*.05));foeHit(f,p.d,{},gd,m);return;}
  if(kind==='poison'){if(foeHit(f,p.d,{notr:1},gd,m))return;if(!g.st.poison){g.st.poison={d:Math.max(1,Math.round(foeAtk(f)*.12)),t:4};say('You are poisoned.','hit');}return;}
  if(kind==='burn'){if(foeHit(f,p.d,{notr:1},gd,m))return;if(!g.st.burn){g.st.burn={d:Math.max(1,Math.round(foeAtk(f)*.15)),t:3};say('You catch fire.','hit');}return;}
  if(kind==='stun'){if(foeHit(f,p.d,{notr:1},gd,m))return;if(!gd){g.st.stun=1;say('You are bound and cannot act next turn!','hit');}return;}
  if(kind==='silence'){if(foeHit(f,p.d,{notr:1},gd,m))return;if(!gd){f.p.sil=2;say('You cannot use skills for a moment.','hit');}return;}
  if(kind==='rewind'){f.hp=Math.min(f.max,f.hp+Math.round(f.max*.08));f.p.fc=0;foeHit(f,p.d,{notr:1},gd,m);return;}
  foeHit(f,p.d,{},gd,m);
}
function playerTick(){
  const f=g.fight;
  for(const k of ['poison','burn']){
    const s=g.st[k];if(!s)continue;
    if(k==='poison'&&compOn('ilsa')){delete g.st[k];say('Ilsa washes the poison from your veins.','sys');continue;}
    if(hurt(s.d,k==='poison'?'Poison burns in your veins':'You are burning','hit'))return;
    if(--s.t<=0)delete g.st[k];
  }
  const S=calc();if(S.regen)heal(maxHp()*S.regen/100);
  for(const n of Object.keys(g.buff)){if(--g.buff[n].t<=0){delete g.buff[n];say('Your '+n+' fades.','sys');}}
  if(f.mark>0)f.mark--;
  if(f.p.sil>0)f.p.sil--;
}

/* ---- player actions ---- */
function aAttack(){turn(()=>{if(hitFoe(1,{})===-1)return -1;return false;});}
function aGuard(){turn(()=>{say('You raise your guard.','sys');return true;});}
function skillUse(id){
  const f=g.fight,P=f.p,s=SKD[id],r=g.sk[id]||0;
  if(!r||P.fc<s.c||P.sil>0)return;
  turn(()=>{
    P.fc-=s.c;
    if(id==='e2'){if(hitFoe(1.7+.25*r,{tag:'Power Strike! '})===-1)return -1;}
    else if(id==='e4'){const S=calc();if(hitFoe(.9,{tag:'Rend! '})===-1)return -1;f.bleed.push({d:Math.max(1,Math.round(S.atk*(.3+.08*r))),t:3});}
    else if(id==='e6'){if(hitFoe((1.2+.2*r)*(1+1.4*(1-Math.max(0,f.hp)/f.max)),{tag:'Execute! '})===-1)return -1;}
    else if(id==='b2'){P.brace=r;say('You brace for the next blow.','sys');}
    else if(id==='b4'){P.rip=r;say('You guard and wait for an opening.','sys');return true;}
    else if(id==='b6'){const h=heal(maxHp()*(.18+.06*r));say('Second Wind. (+'+h+' HP)','win');}
    else if(id==='s2'){if(hitFoe(.9+.15*r,{pierce:1,tag:'You hurl scrap. '})===-1)return -1;}
    else if(id==='s4'){f.mark=5;f.markv=15+5*r;say('You mark '+fnm(f)+'. It takes '+f.markv+'% more damage.','sys');}
    else if(id==='s6'){if(hitFoe(1.3+.1*r,{crit:1,sure:1,tag:'Lucky Break! '})===-1)return -1;}
    return false;
  });
}
function flee(){
  const f=g.fight;
  if(f.boss){say('There is nowhere to run.','hit');turn(()=>false);return;}
  const free=f.el&&bl('tower')>=2;
  if(free||rnd()<.55+calc().dodge/200){
    g.fight=null;g.view=g.delve?'delve':'main';g.st={};say('You break away and lose it in the haze.','sys');
    if(g.delve){say('The delve is over.','sys');g.delve=null;g.view='main';}
    return;
  }
  say('You stumble. It is on you.','hit');turn(()=>false);
}

/* ---- items ---- */
const isUsable=id=>{const t=ITEMS[id]&&ITEMS[id].t;return t==='food'||t==='heal'||t==='buff'||t==='tool';};
function applyItem(id){ // returns true if consumed
  const it=ITEMS[id],S=calc();
  if(it.t==='heal'){
    take(id);const h=heal(maxHp()*it.hpp/100*(1+S.heal/100));
    if(it.cure){delete g.st.poison;delete g.st.burn;}
    say('You drink '+it.n+'. (+'+h+' HP)'+(it.cure?' Ailments cleared.':''),'loot');return true;
  }
  if(it.t==='food'){
    take(id);const km=1+.1*bl('kitchen'),fd=Math.round(it.food*km);
    g.food=Math.min(100,g.food+fd);
    const h=heal(maxHp()*(it.hpp+(bl('kitchen')>=5?2:0))/100);
    say('You eat '+it.n+'. (+'+fd+' food'+(h?', +'+h+' HP':'')+')','loot');
    if(it.bad&&rnd()<.4){return !hurt(Math.max(2,Math.round(maxHp()*.03)),'Your stomach turns',  'hit')||true;}
    return true;
  }
  if(it.t==='buff'){
    if(!g.fight){say('Save it for a fight.','sys');return false;}
    take(id);g.buff[it.b]={m:it.m,t:it.turns+1};
    say('You drink '+it.n+'. ('+it.b[0].toUpperCase()+it.b.slice(1)+' x'+it.m+' for '+it.turns+' turns)','loot');return true;
  }
  if(it.t==='tool'){
    const f=g.fight;if(!f)return false;
    if(id==='pearl'){
      if(f.boss){say('The smoke thins to nothing. This place will not let you leave.','hit');take(id);return true;}
      take(id);g.fight=null;g.view='main';g.st={};if(g.delve){g.delve=null;}
      say('You throw the Smoke Bomb and slip away in the haze.','sys');return true;
    }
    if(id==='tnt'){take(id);const d=Math.round(30+g.lvl*4.5);f.hp-=d;say('You light the Blast Charge and throw it. It deals '+d+'.','loot');return true;}
    if(id==='stunb'){take(id);f.stun=2;say('The Flash Bomb whites out the world. '+fnm(f,1)+' staggers.','loot');return true;}
  }
  return false;
}
function useItem(id){
  if(!have(id))return;
  if(!g.fight){applyItem(id);return;}
  if(ITEMS[id].t==='buff'&&g.buff[ITEMS[id].b]){say('That is already active.','sys');return;}
  const free=rnd()*100<calc().qf;
  if(free){const done=applyItem(id);if(done&&g.fight&&g.fight.hp<=0)win();if(done)say('Quick fingers. No turn spent.','sys');return;}
  turn(()=>{const done=applyItem(id);if(!g.fight)return -1;return false;});
}
const bestHeal=()=>['potion3','potion2','potion'].find(have)||null;

/* ---- auto fight ---- */
function autoStep(){
  const f=g.fight;if(!f)return;
  const P=f.p,S=calc(),hp=g.hp/S.hp,ok=id=>g.sk[id]&&P.fc>=SKD[id].c&&P.sil<=0;
  if(hp<.4){
    if(ok('b6')){skillUse('b6');return;}
    const h=bestHeal();if(h){useItem(h);return;}
    if(!f.boss&&hp<.25){flee();return;}
  }
  const warn=warnNext(f);
  if(warn){if(ok('b2')&&!P.brace){skillUse('b2');return;}if(ok('b4')){skillUse('b4');return;}aGuard();return;}
  const fhp=f.hp/f.max,long=f.max>S.atk*5;
  if(ok('e6')&&fhp<.45){skillUse('e6');return;}
  if(ok('s4')&&!f.mark&&long){skillUse('s4');return;}
  if(ok('s6')&&long){skillUse('s6');return;}
  if(ok('e2')&&(long||P.fc>=70)){skillUse('e2');return;}
  if(ok('e4')&&long&&!f.bleed.length){skillUse('e4');return;}
  if(ok('s2')&&P.fc>=60){skillUse('s2');return;}
  aAttack();
}

/* ---- victory ---- */
function bondGain(c,n){
  const before=bondRank(c);
  g.comp.bond[c]=Math.max(0,(g.comp.bond[c]||0)+(n>0?n*(1+.15*X('bondx')):n));
  if(bondRank(c)>before)say(COMP[c].n+' trusts you more. (Bond rank '+bondRank(c)+')','lvl');
}
function win(){
  const f=g.fight,B=f.boss?BOSSES[f.id]:null,M=B||MOBS[f.id];
  const dv=g.delve;
  g.fight=null;g.view=dv?'delve':'main';g.st={};
  const S=calc(),fx=lvlFx(g.lvl,f.L),R_=rs().r,fl=dv?dv.floor:0;
  g.kills[f.id]=(g.kills[f.id]||0)+1;g.lk[f.id]=(g.lk[f.id]||0)+1;
  g.stats.kills++;g.ls.kills++;
  if(f.el){g.stats.elites++;g.ls.elites++;}
  if(f.trial){trialWin(f);return;}
  const night=isNight(),storm=g.wx===3;
  const xpr=xpOf(f.L)*(B?B.xp*4:1)*(f.el?2.5:1)*R_*fx*(1+.1*fl)*(night?1.15:1);
  const emr=emOf(f.L)*(B?B.em*8:1)*(f.el?3:1)*R_*fx*(1+S.em/100)*(1+.1*fl)*(storm?1.15:1);
  const em=gainEm(emr),xp=gainXp(xpr);
  say(fnm(f,1)+' falls. (+'+xp+' XP, +'+em+' scrip)','win');
  const drops=[],pm=Math.min(1,0+1)*(1+S.loot/100)*(f.el?1.6:1)*(night?1.1:1);
  for(let pass=0;pass<(f.el?2:1);pass++){
    for(const l of (M.loot||[])){
      const id=l[0],p=l[1],lo=l[2],hi=l[3];
      if(rnd()<(p>=1?1:Math.min(.98,p*pm))){const n=lo?R(lo,hi||lo):1;give(id,n);drops.push(nm(id)+(n>1?' x'+n:''));}
    }
  }
  if(drops.length)say('Drops: '+drops.join(', ')+'.','loot');
  // gear
  const gm=(fx<.5?.5:1);
  const gc=.08*(1+S.loot/100)*(f.el?3:1)*gm;
  const gearMode=B?'b':(f.el||fl>=3?'e':'n');
  const ng=B?2:(rnd()<gc?1:0);
  for(let i=0;i<ng;i++){
    const it=dropGear(f.L+(dv?fl:0),gearMode,B?2:null);
    const k=addGear(it);if(k)say('Found '+gname(k)+'.','loot');
  }
  if(f.el&&rnd()<(dv?.14:.07)){give('rift_core');say('An elite leaves a Rift Core behind.','loot');}
  // lamplighter pages
  if(rnd()<(B?.25:.012)){
    const left=PAGES.map((t,i)=>i).filter(i=>!g.pg[i]);
    if(left.length){const i=pick(left);g.pg[i]=1;say('You find a Lamplighter page ('+pageCount()+'/'+PAGES.length+'): "'+PAGES[i]+'"','lvl');}
  }
  // companions grow closer
  if(S.bl)heal(maxHp()*S.bl/100);
  for(const c of g.comp.act)bondGain(c,B?3:.3);
  if(B){
    const first=!g.bd[f.id];
    g.bd[f.id]=1;g.bdAll[f.id]=1;
    const rl=RELICS.find(r=>r.from===f.id);
    if(rl&&!g.gear.some(x=>x.rl===rl.id)&&(first||rnd()<.12)){
      const it=mkGear(rl.slot,rl.tier,4,rl);g.gear.push(it);say('Relic: '+rl.n+'. '+rl.d,'lvl');
    }
    if(B.won)say(B.won,'lvl');
    lore('b_'+f.id);
    if(first)for(const z in ZONES)if(ZONES[z].req===f.id)say('The way to '+ZONES[z].n+' is open.','sys');
    if(first&&f.id==='hollow_king')say('You feel a Rebirth waiting back at camp, if you want it.','sys');
  }
  if(dv){delveWin(f);}
  if(g.bless&&--g.bless.left<=0){say('Your blessing fades.','sys');g.bless=null;}
  checkQuests();checkAch();
}

/* ================= WORLD: exploring, events, delves, bounties, shop, forge ================= */
const zoneL=Z=>R(Z.lo,Z.hi);
const elChance=()=>.07+(isNight()?.03:0)+.01*g.re;
function randFoe(Z,L,forceEl){
  const id=wpick(Z.enc),fuse=MOBS[id].tr.indexOf('fuse')>=0;
  return mkFoe(id,L,{el:!fuse&&(forceEl||rnd()<elChance())});
}
function checkQuests(){
  for(const q of QUESTS){
    const s=g.q[q.id];
    if(s&&s.s==='active'&&!s.n){const p=qProg(q);if(p[0]>=p[1]){s.n=1;say('Quest ready: '+q.title+'. Report to camp.','lvl');}}
  }
}
function hazard(pct,msg){return hurt(Math.max(2,Math.round(maxHp()*pct/100)),msg);}

/* ---------- movement ---------- */
function explore(){
  const Z=ZONES[g.loc];if(g.loc==='camp'||g.fight)return;
  tick(1,1.4);
  g.prog[g.loc]=(g.prog[g.loc]||0)+1;
  const r=g.nx!=null?g.nx:rnd();g.nx=rnd();
  if(r<.5){
    const amb=rnd()<.1-.03*(bl('tower')>=1?1:0)-.03*(bl('tower')>=4?1:0);
    startFight(randFoe(Z,zoneL(Z)),{ambush:amb});
  }else if(r<.74){
    const id=wpick(Z.find);let n=R(1,2);if(rnd()*100<calc().loot)n++;
    give(id,n);say(pick(Z.flavor)+' You pick up '+nm(id)+(n>1?' x'+n:'')+'.','loot');
  }else runEvent(pick(Z.ev));
  checkQuests();
}
function gather(){
  const Z=ZONES[g.loc];if(g.loc==='camp'||g.fight)return;
  tick(2,2.6);
  if(rnd()<.12){say('You are not alone out here.','hit');startFight(randFoe(Z,zoneL(Z)),{ambush:true});return;}
  const got={};
  for(let i=0;i<R(2,3);i++){const id=wpick(Z.find);got[id]=(got[id]||0)+R(1,2)+(rnd()*100<calc().loot?1:0);}
  const txt=[];for(const id in got){give(id,got[id]);txt.push(nm(id)+(got[id]>1?' x'+got[id]:''));}
  say('You comb the area slowly. '+txt.join(', ')+'.','loot');
  checkQuests();
}
function travel(z){
  if(!unlocked(z))return;
  tick(3,3);g.loc=z;g.view='main';g.nx=null;
  const Z=ZONES[z];say(Z.arrive);lore('z_'+z);
  if(z!=='camp'){
    const sid='arr_'+z;
    if(SC[sid]&&!g.seen[sid]){g.seen[sid]=1;scene(sid);}
  }
}

function bounty(){ // gain: ensure board for today
  if(g.bt&&g.bt.day===g.day)return;
  const keep=g.bt?g.bt.list.filter(b=>b.s===1):[];
  const zs=Object.keys(ZONES).filter(z=>z!=='camp'&&unlocked(z));
  while(keep.length<3){
    const z=pick(zs.slice(-Math.max(2,Math.ceil(zs.length*.6)))),Z=ZONES[z];
    const m=wpick(Z.enc),n=R(5,9),L=Math.round((Z.lo+Z.hi)/2);
