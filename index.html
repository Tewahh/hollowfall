/* ---------- delves ---------- */
function startDelve(z){
  const Z=ZONES[z];
  g.delve={z:z,floor:0,rested:0};
  say('You descend into the dark beneath the '+Z.n+'. The stair does not go back up.','hit');
  lore('z_'+z);
  nextFloor();
}
function nextFloor(){
  const d=g.delve,Z=ZONES[d.z];d.floor++;
  tick(1,1.5);
  const boss=d.floor%5===0,L=Z.hi+Math.floor(d.floor*.7);
  if(boss)say('Floor '+d.floor+': something large waits at the stair.','hit');else say('Floor '+d.floor+'.','sys');
  startFight(randFoe(Z,L,boss||rnd()<.12));
}
function delveWin(f){
  const d=g.delve;
  if(d.floor>(g.dvBest[d.z]||0))g.dvBest[d.z]=d.floor;
  say('Floor '+d.floor+' cleared.','sys');g.view='delve';
}
function delveLeave(){
  const d=g.delve,Z=ZONES[d.z],fl=d.floor;
  const n=1+Math.floor(fl/3),L=Z.hi+Math.floor(fl*.7);
  say('You climb out with the day\'s spoils.','win');
  for(let i=0;i<n;i++){const k=addGear(dropGear(L,'d',fl>=6?2:1));if(k)say('Chest: '+gname(k)+'.','loot');}
  const em=gainEm(emOf(L)*fl*3);say('Chest: +'+em+' scrip.','loot');
  if(fl>=3){const c=R(1,1+Math.floor(fl/5));give('rift_core',c);say('Chest: Rift Core x'+c+'.','loot');}
  if(fl>=3){g.stats.delves++;g.ls.delves++;}
  g.delve=null;g.view='main';
  checkQuests();checkAch();
}
function delveRest(){const d=g.delve;if(d.floor-d.rested<3)return;d.rested=d.floor;const h=heal(maxHp()*.35);say('You catch your breath on the landing. (+'+h+' HP)','win');}

/* ---------- companions ---------- */
const slots=()=>1+(g.lvl>=20?1:0)+(g.lvl>=40?1:0);
function recruit(c){
  if(g.comp.have[c])return;
  g.comp.have[c]=1;
  say(COMP[c].n+' joins you. ('+COMP[c].role+': '+COMP[c].d+')','lvl');
  if(g.comp.act.length<slots())g.comp.act.push(c);
  else say('Your party is full. Swap members in Party.','sys');
}
function togglePartner(c){
  const i=g.comp.act.indexOf(c);
  if(i>=0){g.comp.act.splice(i,1);return;}
  if(g.comp.act.length>=slots()){say('Your party is full.','sys');return;}
  g.comp.act.push(c);
}

/* ---------- scenes ---------- */
function condOK(c){return c==='allComps'?Object.keys(COMP).every(x=>g.comp.have[x]):true;}
function applyEff(e){
  if(!e)return;
  if(e.f){g.fl[e.f]=1;if(e.f.indexOf('end_')===0){g.ends[e.f]=1;lore(e.f);}}
  if(e.it)for(const k in e.it){give(k,e.it[k]);say('Received '+nm(k)+(e.it[k]>1?' x'+e.it[k]:'')+'.','loot');}
  if(e.lore)lore(e.lore);
  if(e.comp)recruit(e.comp);
  if(e.bond)bondGain(e.bond[0],e.bond[1]);
  if(e.echo){g.ech+=e.echo;say('+'+e.echo+' Echoes.','lvl');}
  if(e.em){const v=gainEm(e.em);say('+'+v+' scrip.','loot');}
  if(e.xp){const v=gainXp(e.xp);say('+'+v+' XP.','lvl');}
  if(e.bld){g.bld[e.bld[0]]=Math.max(bl(e.bld[0]),e.bld[1]);say('The '+BLD[e.bld[0]].n+' is now yours to use.','lvl');}
  if(e.page){for(let n=0;n<e.page;n++){const left=PAGES.map((t,i)=>i).filter(i=>!g.pg[i]);if(left.length){const i=pick(left);g.pg[i]=1;say('Lamplighter page ('+pageCount()+'/'+PAGES.length+'): "'+PAGES[i]+'"','lvl');}}}
  if(e.q&&!g.q[e.q]){g.q[e.q]={s:'active'};say('Quest accepted: '+QD[e.q].title+'.','sys');}
  if(e.title){g.titles[e.title]=1;say('Title earned: '+e.title+'.','lvl');}
}
function scene(id){
  const s=SC[id];if(!s)return;
  s.l.forEach(t=>say(t,'npc'));
  if(s.c&&s.c.filter(c=>condOK(c.if)).length){g.scene={id:id};g.view='scene';return;}
  applyEff(s.e);
}
function sceneChoice(i){
  const s=SC[g.scene.id],list=s.c.filter(c=>condOK(c.if)),c=list[i];
  g.scene=null;g.view='main';
  c.l.forEach(t=>say(t,'npc'));
  applyEff(c.e);applyEff(s.e);
  checkQuests();checkAch();
}

/* ---------- quests ---------- */
const qDone=id=>!!(g.q[id]&&g.q[id].s==='done');
const qOpen=q=>(!q.req||q.req.every(qDone))&&(!q.a||act()>=q.a)&&!g.q[q.id];
function qProg(q){
  const o=q.o;
  switch(o.k){
    case 'kill':return BOSSES[o.m]?[g.bd[o.m]?1:0,1]:[g.lk[o.m]||0,o.n];
    case 'have':return [have(o.i),o.n];
    case 'explore':return [g.prog[o.z]||0,o.n];
    case 'stat':return [g.ls[o.s]||0,o.n];
    case 'pages':return [pageCount(),o.n];
    case 'gear':{const w=eqi('w');return [w?tierOf(w):0,o.t];}
    case 'build':return [bl(o.b),o.l];
    case 'lvl':return [g.lvl,o.n];
  }
  return [0,1];
}
function qDesc(q){
  const o=q.o;
  switch(o.k){
    case 'kill':return BOSSES[o.m]?'Defeat '+BOSSES[o.m].n+'.':'Defeat '+o.n+' '+MOBS[o.m].n+'.';
    case 'have':return 'Bring '+o.n+' '+nm(o.i)+'.';
    case 'explore':return 'Explore '+ZONES[o.z].n+' '+o.n+' times.';
    case 'stat':return {kills:'Defeat '+o.n+' enemies in this life.',elites:'Defeat '+o.n+' elites.',delves:'Complete '+o.n+' delves.'}[o.s]||'Do something remarkable.';
    case 'pages':return 'Collect '+o.n+' Lamplighter pages.';
    case 'gear':return 'Equip a tier-'+o.t+' weapon.';
    case 'build':return 'Raise the '+BLD[o.b].n+' to level '+o.l+'.';
    case 'lvl':return 'Reach level '+o.n+'.';
  }
  return '';
}
const qReady=q=>{const s=g.q[q.id];if(!s||s.s!=='active')return false;const p=qProg(q);return p[0]>=p[1];};
const anyQReady=()=>QUESTS.some(qReady);
const anyQNew=()=>QUESTS.some(q=>qOpen(q)&&q.t==='main');
function acceptQ(q){
  g.q[q.id]={s:'active'};
  if(q.on)say(q.on,'npc');
  say('Quest accepted: '+q.title+'.','sys');
  if(q.comp)recruit(q.comp);
  if(q.sa)scene(q.sa);
  checkQuests();
}
function claimQ(q){
  if(!qReady(q))return;
  if(q.o.k==='have')take(q.o.i,q.o.n);
  g.q[q.id]={s:'done'};
  const m=1+.35*g.re,rw=q.rw;
  say('Quest complete: '+q.title+'.','win');
  if(rw.em){const v=gainEm(rw.em*m);say('+'+v+' scrip.','loot');}
  for(const i in (rw.items||{})){give(i,rw.items[i]);say('Received '+nm(i)+(rw.items[i]>1?' x'+rw.items[i]:'')+'.','loot');}
  if(rw.echo){g.ech+=rw.echo;say('+'+rw.echo+' Echoes.','lvl');}
  if(rw.xp)gainXp(rw.xp*m*.6);
  if(q.sd)scene(q.sd);
  checkQuests();checkAch();
}

/* ---------- shop ---------- */
const SHOPI=[['bread',1],['apple',1],['pork',1],['potion',1],['antidote',1],['pearl',1],['tnt',1],['strength',1],['ward',2],['stunb',2],['potion2',2],['ration',2],['totem',3],['feast',3],['potion3',4],['strength2',4]];
function stock(){
  if(g.shop&&g.shop.day===g.day)return;
  const n=3+(bl('market')>=1?1:0),list=[];
  const tl=tierFor(g.lvl+3);
  for(let i=0;i<n;i++){
    const r=rollRar([50,33,14,3]);
    list.push({it:mkGear(pick(SLOTS),clamp(tl-(rnd()<.3?1:0),1,10),r),sold:0});
  }
  if(bl('market')>=5)list.push({it:mkGear(pick(SLOTS),tl,3),sold:0});
  g.shop={day:g.day,list:list};
}
const gearPrice=i=>Math.max(5,Math.round(GEAR[i.b].v*RVAL[i.r]*(i.r>=3?1.5:1.1)*(1-calc().buy/100)));
function buyGear(o){const p=gearPrice(o.it);if(o.sold||g.em<p)return;if(g.gear.length>=90){say('Your pack is full.','sys');return;}g.em-=p;o.sold=1;g.gear.push(o.it);say('Bought '+gname(o.it)+' for '+fmt(p)+' scrip.','sys');}
function buy(id){const p=price(id);if(g.em<p)return;g.em-=p;give(id);say('Bought '+nm(id)+' for '+p+' scrip.','sys');}
function sellItem(id,all){const n=all?have(id):Math.min(1,have(id));if(n<=0)return;const p=sellVal(id,n);take(id,n);g.em+=p;say('Sold '+nm(id)+(n>1?' x'+n:'')+' for '+fmt(p)+' scrip.','sys');}
function sellG(i){if(i.lk||g.eq[slotOf(i)]===i.u)return;const v=gval(i);g.em+=v;g.gear.splice(g.gear.indexOf(i),1);say('Sold '+gname(i)+' for '+fmt(v)+' scrip.','sys');}
function dismantle(i){
  if(i.lk||g.eq[slotOf(i)]===i.u)return;
  const t=tierOf(i),n=Math.round((t*1.5+1)*(1+i.r*.8));
  give('scrap',n);const T=TIERS[t-1];let extra='';
  if(rnd()<.3){const m=pick(T.c)[0];give(m);extra=' and '+nm(m);}
  g.gear.splice(g.gear.indexOf(i),1);
  say('Dismantled '+gname(i)+': Salvage x'+n+extra+'.','sys');
}
function junkSell(maxr){
  let v=0,c=0;
  for(const i of g.gear.slice()){if(i.lk||i.rl||g.eq[slotOf(i)]===i.u||i.r>maxr)continue;v+=gval(i);c++;g.gear.splice(g.gear.indexOf(i),1);}
  g.em+=v;say(c?'Sold '+c+' items for '+fmt(v)+' scrip.':'Nothing to sell.','sys');
}

/* ---------- forge ---------- */
const forgeCap=()=>[0,3,5,7,9,10][bl('forge')];
const enhCost=i=>{const t=tierOf(i);return{em:Math.round(BV[t-1]*.3*Math.pow(i.e+1,1.5)),scrap:(i.e+1)*Math.ceil(t/2)+1};};
const enhChance=e=>[1,1,1,.85,.75,.65,.55,.45,.38,.3][e]||0;
function enhance(i){
  const c=enhCost(i);
  if(i.e>=forgeCap()||g.em<c.em||have('scrap')<c.scrap)return;
  g.em-=c.em;take('scrap',c.scrap);
  if(rnd()<enhChance(i.e)){i.e++;say(gname(i)+' takes the heat. (+'+i.e+')','win');}
  else say('The metal cracks and cools. Nothing gained.','hit');
  g.stats.crafts++;checkAch();
}
const reCost=i=>({em:Math.round(BV[tierOf(i)-1]*.25*(i.r+1)),scrap:2*tierOf(i)});
function reforge(i){
  const c=reCost(i);
  if(i.rl||bl('forge')<2||g.em<c.em||have('scrap')<c.scrap)return;
  g.em-=c.em;take('scrap',c.scrap);rollAff(i);say('You reforge '+gname(i)+'.','win');
}
const awCost=i=>({rc:i.r+1,em:Math.round(BV[tierOf(i)-1]*.6*(i.r+1))});
function awaken(i){
  const c=awCost(i);
  if(i.rl||i.r>=3||bl('forge')<3||g.em<c.em||have('rift_core')<c.rc)return;
  g.em-=c.em;take('rift_core',c.rc);i.r++;rollAff(i);say(gname(i)+' flares and wakes: '+RAR[i.r]+'.','lvl');checkAch();
}
const CRAFTW=[null,[85,15,0,0],[70,25,5,0],[55,32,11,2],[40,36,19,5],[28,38,26,8]];
const canCraft=r=>r.in.every(([i,n])=>have(i)>=n)&&(!r.fl||bl('forge')>=r.fl)&&(!r.kl||bl('kitchen')>=r.kl);

const craftFee=r=>r.g?Math.round(BV[+r.g.slice(1)-1]*.5):0;
function craft(r){
  if(!canCraft(r)||g.em<craftFee(r))return;
  g.em-=craftFee(r);
  r.in.forEach(([i,n])=>take(i,n));
  g.stats.crafts++;
  if(r.g){
    const slot=r.g[0],tier=+r.g.slice(1);
    const it=mkGear(slot,tier,rollRar(CRAFTW[Math.max(1,bl('forge'))]));
    const k=addGear(it,true);say('Forged '+gname(it)+'.','loot');
  }else{give(r.out);say('Made '+nm(r.out)+'.','loot');}
  checkAch();
}

/* ---------- buildings, upgrades, echo, skills ---------- */
const bCost=(b,l)=>{const c=BLD[b].c[l],m=1-.08*X('foreman');return{e:Math.round(c.e*m),i:c.i};};
const canBuild=b=>{const l=bl(b);if(l>=BLD[b].max)return false;const c=bCost(b,l);return g.em>=c.e&&Object.entries(c.i).every(([i,n])=>have(i)>=n);};
function build(b){
  if(!canBuild(b))return;
  const l=bl(b),c=bCost(b,l);g.em-=c.e;for(const i in c.i)take(i,c.i[i]);
  g.bld[b]=l+1;say('The '+BLD[b].n+' is now level '+(l+1)+'. '+BLD[b].d[l],'lvl');checkQuests();checkAch();
}
const upCost=(u,l)=>Math.round(u.base*Math.pow(1.55,l));
function buyUp(u){const l=U(u.id),c=upCost(u,l);if(l>=u.max||g.em<c)return;g.em-=c;g.up[u.id]=l+1;say(u.n+' upgraded to '+(l+1)+'.','sys');if(u.id==='vit')heal(maxHp()*.04);}
const echoCost=(u,l)=>u.base*(l+1);
function buyEcho(u){const l=X(u.id),c=echoCost(u,l);if(l>=u.max||g.ech<c)return;g.ech-=c;g.eu[u.id]=l+1;say(u.n+' raised to '+(l+1)+'.','sys');}
function rankUp(s){
  const p=sp();if(p.used>=p.tot||(g.sk[s.id]||0)>=s.max||!skillAvail(s))return;
  g.sk[s.id]=(g.sk[s.id]||0)+1;say(s.n+' rank '+g.sk[s.id]+'.','sys');
}
const respecCost=()=>Math.round(g.lvl*g.lvl*1.5*[1,.85,.5,.5,.1,0][bl('library')]);
function respec(){const c=respecCost();if(g.em<c||!Object.keys(g.sk).length)return;g.em-=c;g.sk={};say('Your training unravels. All skill points are free again.','sys');}

/* ---------- achievements ---------- */
function checkAch(){
  for(const a of ACH){
    if(g.ach[a.id])continue;
    let ok=false;try{ok=!!a.t();}catch(e){}
    if(!ok)continue;
    g.ach[a.id]=1;
    let m='Achievement: '+a.n+'.';
    if(a.em){g.em+=a.em;m+=' +'+fmt(a.em)+' scrip.';}
    if(a.ec){g.ech+=a.ec;m+=' +'+a.ec+' Echoes.';}
    if(a.ti){g.titles[a.ti]=1;m+=' Title: '+a.ti+'.';}
    say(m,'lvl');
  }
}

/* ---------- rebirth ---------- */
const doneQ=()=>Object.values(g.q).filter(s=>s.s==='done').length;
const echoGain=()=>Math.round((g.lvl*2.2+Object.keys(g.bd).length*12+Math.floor(g.ls.kills/7)+doneQ()*1.5)*(g.bd.quiet?1:.5));
const canRebirth=()=>!!g.bd.hollow_king;
function kit(){
  const k=X('kit');
  const eq=(slot,tier,r)=>{const it=mkGear(slot,tier,r||0);g.gear.push(it);g.eq[slot]=it.u;};
  if(k>=1){eq('w',2,1);give('bread',3);}
  if(k>=2){eq('w',3,1);eq('a',1,1);give('potion',2);}
  if(k>=3){eq('a',3,1);eq('h',2,1);give('potion',3);give('totem');}
}
function rebirth(){
  const gain=echoGain(),old=g,n=fresh();
  n.re=old.re+1;n.ech=old.ech+gain;
  ['eu','lore','bdAll','ends','ach','titles','title','pg','dvBest','kills','as','stats','trB'].forEach(k=>{n[k]=old[k];});
  n.comp.bond=old.comp.bond;
  g=n;ev=null;UI.auto=false;UI.hunt=false;
  const w=mkGear('w',1,0);g.gear.push(w);g.eq.w=w.u;
  kit();g.hp=maxHp();
  log.replaceChildren();
  say('The Hollow Crown turns to ash in your hands. The world folds up like a letter and unfolds again, a little meaner. You wake at Ember Camp with a bowl in your hands and Mara watching you.');
  say('Rebirth '+g.re+'. +'+gain+' Echoes. Enemies are stronger now, and they pay better.','lvl');
  lore('rebirth');
  scene('s_intro');
}
function newGame(){
  g=fresh();ev=null;UI.cf=null;
  const w=mkGear('w',1,0);g.gear.push(w);g.eq.w=w.u;
  g.hp=maxHp();
  log.replaceChildren();
  say('The sky split on a Tuesday. By Friday the sun was a smear behind the ash.');
  say('You wake at Ember Camp, the last lit fire for a hundred miles. A scrap club, two rounds of hardtack, and a long way to go.');
  say('Tap Travel to head out, then Explore. Eat when Food runs low. Mara\'s board has work. Once you know the ropes, Hunt keeps exploring for you and Auto plays your fights. Pack, Skills and Camp are where you grow.','sys');
  scene('s_intro');
}
function talkTo(n){
  if(g.talked[n]===g.day){say(NPCN[n]+' has nothing new to say today.','sys');return;}
  g.talked[n]=g.day;
  const a=Math.min(6,act());
  const lines=(TALK[n]||{})[a]||(TALK[n]||{})[1]||[];
  if(lines.length)say(pick(lines),'npc');
  if(COMP[n]&&g.comp.have[n])bondGain(n,2);
}

/* ---------- trials: repeatable boss rematches that scale without end ---------- */
const trTier=id=>(g.trB[id]||0)+1;
function startTrial(id){
  const t=trTier(id),b=BOSSES[id];
  g.loc='camp';
  say('You step into the Echo of '+b.n+'. Trial tier '+t+'.','hit');
  const f=mkFoe(id,Math.max(b.p,Math.round(g.lvl*.85))+Math.floor(t*1.5),{mult:1+.4*t,trial:t});
  startFight(f);
}
function trialWin(f){
  const t=f.trial,B=BOSSES[f.id];
  g.view='main';
  const S=calc();
  const em=gainEm(emOf(f.L)*B.em*10*(1+.25*t)*(1+S.em/100)),xp=gainXp(xpOf(f.L)*B.xp*3);
  say('The Echo of '+B.n+' fades. (+'+fmt(xp)+' XP, +'+fmt(em)+' scrip)','win');
  const rc=1+Math.floor(t/2);give('rift_core',rc);
  const ng=1+Math.floor(t/3);
  for(let i=0;i<ng;i++){const it=dropGear(f.L,'b',2);const k=addGear(it);if(k)say('Trial reward: '+gname(k)+'.','loot');}
  say('Rift Core x'+rc+'.','loot');
  if(t>(g.trB[f.id]||0)){g.trB[f.id]=t;const e=Math.max(1,Math.round(t*(B.p/20)));g.ech+=e;say('First time at tier '+t+': +'+e+' Echoes.','lvl');}
  g.stats.trials++;
  checkQuests();checkAch();
}

/* ================= UI ================= */
function B(label,fn_,cls,disabled){
  const b=el('button','btn '+(cls||''),label);b.type='button';
  if(disabled||!fn_)b.disabled=true;
  else b.addEventListener('click',()=>{UI.cf=null;fn_();render();});
  return b;
}
function Bc(label,fn_,cls,disabled){ // button that does not clear confirm state
  const b=el('button','btn '+(cls||''),label);b.type='button';
  if(disabled||!fn_)b.disabled=true;else b.addEventListener('click',()=>{fn_();render();});
  return b;
}
function row(title,sub_,btns,tcls){
  const r=el('div','row'),t=el('div','rt'),s=el('small');
  t.append(el('b',tcls||null,title));
  if(sub_ instanceof Node)s.append(sub_);else s.textContent=sub_||'';
  t.append(s);const a=el('div','ra');a.append(...(btns||[]));r.append(t,a);return r;
}
function head(t,back){const h=el('div','dh');h.append(el('h2',null,t),B('Back',()=>{g.view=back||'main';UI.tab={};},'sm'));return h;}
function grid(btns,one){const d=el('div','grid'+(one?' one':''));d.append(...btns);return d;}
function sec(t){return el('p','sec',t);}
function hint(t,cls){return el('p','hint'+(cls?' '+cls:''),t);}
function tabs(key,list){
  const cur=UI.tab[key]||list[0][0],d=el('div','tabs');
  list.forEach(([id,label])=>{
    const b=el('button','btn sm'+(cur===id?' on':''),label);b.type='button';b.setAttribute('aria-pressed',cur===id?'true':'false');
    b.addEventListener('click',()=>{UI.tab[key]=id;UI.cf=null;render();});d.append(b);
  });
  return [d,cur];
}
function costFrag(items,em){
  const f=document.createDocumentFragment();let first=true;
  const add=(txt,ok)=>{if(!first)f.append(' · ');first=false;f.append(el('span',ok?'ok':'no',txt));};
  if(em)add(fmt(em)+' scrip',g.em>=em);
  items.forEach(([id,n])=>add(nm(id)+' '+Math.min(have(id),9999)+'/'+n,have(id)>=n));
  return f;
}
function itemSub(id){
  const i=ITEMS[id];
  if(i.t==='heal')return '+'+i.hpp+'% HP'+(i.cure?', cures ailments':'');
  if(i.t==='food')return '+'+i.food+' food'+(i.hpp?', +'+i.hpp+'% HP':'');
  if(i.t==='buff')return i.b==='rage'?'ATK x'+i.m+' for '+i.turns+' turns (fight)':'DEF x'+i.m+' for '+i.turns+' turns (fight)';
  if(i.t==='tool')return {pearl:'Escape a fight (not bosses)',tnt:'Heavy damage that ignores armor',stunb:'Stuns the enemy for 2 turns'}[id];
  if(i.t==='totem')return 'Cheats death once, automatically';
  return 'Worth '+i.v;
}
const IORD={heal:0,food:1,buff:2,tool:3,totem:4,mat:5};
const invIds=()=>Object.keys(g.inv).filter(id=>ITEMS[id]).sort((a,b)=>IORD[ITEMS[a].t]-IORD[ITEMS[b].t]||nm(a).localeCompare(nm(b)));
function cmpFrag(i){
  const e=eqi(slotOf(i)),a=gstat(i),b=e&&e.u!==i.u?gstat(e):{atk:0,def:0,hp:0};
  const f=document.createDocumentFragment();
  [['atk','ATK'],['def','DEF'],['hp','HP']].forEach(([k,l])=>{const d=(a[k]||0)-(b[k]||0);if(d){f.append(el('span',d>0?'ok':'no',l+' '+(d>0?'+':'')+d),' ');}});
  return f;
}

/* ---------- status ---------- */
function setBar(k,v,max,text){$('#'+k+'T').textContent=text;$('#'+k+'F').style.width=clamp(v/max*100,0,100)+'%';}
function renderStatus(){
  const S=calc();
  $('#loc').textContent=g.delve?'Delve '+g.delve.floor+' · '+ZONES[g.delve.z].n:ZONES[g.loc].n;
  $('#day').textContent='Day '+g.day+' · '+PHASES[phase()]+' · '+WX[g.wx][0];
  setBar('hp',g.hp,S.hp,'HP '+Math.max(0,g.hp)+'/'+S.hp);
  setBar('food',g.food,100,'Food '+g.food);
  setBar('xp',g.xp,need(g.lvl),g.lvl>=99?'MAX':'XP '+fk(g.xp)+'/'+fk(need(g.lvl)));
  $('#lv').textContent='Lv '+g.lvl;$('#atk').textContent='ATK '+S.atk;$('#def').textContent='DEF '+S.def;
  $('#em').textContent=fmt(g.em)+' scrip';
  const bf=[];if(g.bless)bf.push(BSD[g.bless.id].n.replace(' Blessing','')+' '+g.bless.left);
  for(const n in g.buff)bf.push(n[0].toUpperCase()+n.slice(1)+' '+g.buff[n].t);
  $('#bf').textContent=bf.join(' · ');

}

/* ---------- deck views ---------- */
const bossReady=Z=>Z.boss&&!g.bd[Z.boss.id]&&(g.prog[g.loc]||0)>=Z.boss.need;
function foePanel(f){
  const c=el('div','foe'),bar=el('div','bar'),i=el('i');
  i.style.width=clamp(f.hp/f.max*100,0,100)+'%';bar.append(i);
  c.append(el('b',null,(f.el?'Elite ':'')+f.n+'  ·  Lv '+f.L),bar);
  const tags=trList(f);
  if(f.mark>0)tags.push('Marked');if(f.bleed.length)tags.push('Bleeding');if(f.stun>0)tags.push('Stunned');
  if(f.ph)tags.push('Phase '+(f.ph+1));
  c.append(el('small',null,'HP '+fmt(Math.max(0,f.hp))+'/'+fmt(f.max)+(tags.length?'  ·  '+tags.join(', '):'')));
  const me=['You '+Math.max(0,g.hp)+'/'+maxHp(),'Focus '+Math.round(f.p.fc)+'/100'];
  if(g.st.poison)me.push('Poisoned');if(g.st.burn)me.push('Burning');if(g.st.stun)me.push('Stunned');if(f.p.sil>0)me.push('Silenced');
  g.comp.act.forEach(x=>me.push(COMP[x].n));
  c.append(el('small',null,me.join('  ·  ')));
  const w=warnNext(f);if(w)c.append(el('small','warn','! '+w));
  return c;
}
function viewFight(k){
  const f=g.fight;k.push(foePanel(f));
  if(g.view==='fpack'){
    k.push(head('Use an item','fight'));
    const ids=invIds().filter(isUsable);
    if(!ids.length)k.push(hint('Nothing to use.'));
    ids.forEach(id=>k.push(row(nm(id)+' x'+have(id),itemSub(id),[B('Use',()=>{g.view='fight';useItem(id);},'sm')])));
    return;
  }
  const b=[B('Attack',aAttack,'primary'),B('Guard',aGuard)];
  SKILLS.filter(s=>s.act&&g.sk[s.id]).forEach(s=>{
    b.push(B(s.n+' ('+s.c+')',()=>skillUse(s.id),'',f.p.fc<s.c||f.p.sil>0));
  });
  b.push(B('Items',()=>{g.view='fpack';}));
  b.push(B('Flee',flee,'danger'));
  b.push(Bc(UI.auto?'Auto: ON':'Auto',()=>{UI.auto=!UI.auto;}, UI.auto?'on':''));

}
function viewMain(k){
  if(g.loc==='camp'){
    const q=anyQReady()?' !':(anyQNew()?' *':'');
    const b=[B('Rest',rest,'primary'),B('Travel',()=>{g.view='travel';}),B('Quests'+q,()=>{g.view='board';}),B('Bounties',()=>{bounty();g.view='bounty';}),
      B('Pack',()=>{g.view='pack';}),B('Skills',()=>{g.view='skills';}),B('Party',()=>{g.view='party';}),B('Camp',()=>{g.view='camp';}),
      B('Journal',()=>{g.view='journal';}),B('Records',()=>{g.view='rec';})];
    if(Object.keys(g.bdAll).length)b.push(B('Echo Trials',()=>{g.view='trial';}));

function viewBoard(k){

      btns.push(B('Break',()=>dismantle(i),'sm'));
    }
  }
  const sub_=document.createDocumentFragment();
  sub_.append(SLOTN[s]+' · T'+tierOf(i)+' · '+RAR[i.r]+'  ·  ');

      ['XP bonus',Math.round(S.xp)+'%'],['Scrip bonus',Math.round(S.em)+'%'],['Loot bonus',Math.round(S.loot)+'%'],['Regen per turn',Math.round(S.regen*10)/10+'%'],
      ['Tonic potency','+'+Math.round(S.heal)+'%'],['Hunger saved',Math.round(S.food)+'%'],['Sell bonus',Math.round(S.sell)+'%'],['Shop discount',Math.round(S.buy)+'%'],
      ['Skill points free',p.tot-p.used],['Party slots',slots()]];

/* ---------- settings ---------- */
function exportCode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(g))));}catch(e){return '';}}
function importCode(s){
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
    let n=null;if(o&&o.v===4)n=norm(o);else if(o&&o.v===1)n=migrate(o);
    if(!n)return false;
    g=n;ev=null;UI.auto=false;UI.hunt=false;
    log.replaceChildren();g.log.forEach(([t,c])=>say(t,c,false));
    if(g.fight)g.view='fight';else if(g.scene)g.view='scene';else g.view='main';
    say('Save imported.','sys');return true;
  }catch(e){return false;}
}
function viewTrial(k){
  k.push(head('Echo Trials'));
  k.push(hint('Fight the echo of any guardian you have felled. Each win raises the tier: stronger, and richer in Rift Cores, gear and Echoes.'));
  const ids=Object.keys(BOSSES).filter(id=>g.bdAll[id]);
  if(!ids.length)k.push(hint('Defeat a guardian first.'));
  ids.forEach(id=>{const t=trTier(id);k.push(row(BOSSES[id].n,'Next: tier '+t+'  ·  Best: '+(g.trB[id]||0),[B('Fight',()=>startTrial(id),'sm danger',g.hp<maxHp()*.7)]));});
  if(ids.length&&g.hp<maxHp()*.7)k.push(hint('Rest first. You need at least 70% HP to enter.','warn'));
}

function renderDeck(){
  const k=[],v=g.view;
  if(g.fight&&(v==='fight'||v==='fpack'))viewFight(k);
  else if(v==='event'&&ev)k.push(grid(ev.opts.map((o,i)=>B(o.l,()=>choose(i),i===0?'primary':'')),true));
  else if(v==='scene'&&g.scene)viewScene(k);
  else if(v==='delve'&&g.delve)viewDelve(k);
  else if(v==='pack')viewPack(k);
  else if(v==='travel')viewTravel(k);
  else if(v==='board')viewBoard(k);
  else if(v==='bounty'){bounty();viewBounty(k);}
  else if(v==='camp')viewCamp(k);
  else if(v==='talk')viewTalk(k);
  else if(v==='party')viewParty(k);
  else if(v==='forge')viewForge(k);
  else if(v==='cook')viewCook(k);
  else if(v==='shop')viewShop(k);
  else if(v==='build')viewBuild(k);
  else if(v==='skills')viewSkills(k);
  else if(v==='upg')viewUpg(k);
  else if(v==='echo')viewEcho(k);
  else if(v==='journal')viewJournal(k);
  else if(v==='rec')viewRec(k);
  else if(v==='set')viewSet(k);
  else if(v==='trial')viewTrial(k);
  else if(v==='rebirth')viewRebirth(k);
  else{g.view='main';viewMain(k);}
  const keepScroll=UI.lastView===g.view;
  const st=deck.scrollTop;
  deck.replaceChildren(...k);
  deck.scrollTop=keepScroll?st:0;UI.lastView=g.view;
}

/* ---------- loop: auto-fight and hunting ---------- */
function healOutside(){
  const S=calc();
  if(g.hp/S.hp<.45){
    const h=bestHeal();if(h){applyItem(h);return true;}
    const fd=['feast','ration','pork','stew'].find(have);if(fd){applyItem(fd);return true;}
  }
  return false;
}
function huntStep(){
  if(g.fight||g.view!=='main'||g.loc==='camp'){UI.hunt=false;return;}
  const Z=ZONES[g.loc],S=calc();
  if(bossReady(Z)){UI.hunt=false;say('Hunt stopped: a guardian waits here.','sys');return;}
  if(g.hp/S.hp<.5&&!healOutside()){
    if(g.hp/S.hp<.4){UI.hunt=false;say('Hunt stopped: you are hurt and out of tonics.','sys');return;}
  }
  if(g.food<25){const f=foodItem();if(f)applyItem(f);else if(g.food<10){UI.hunt=false;say('Hunt stopped: out of food.','sys');return;}}
  explore();
  if(!g.fight&&g.view!=='main')say('Hunt paused. Something needs a decision.','sys');
}
function schedule(){
  if(UI.noTimers||UI.timer)return;
  const fightAuto=UI.auto&&g.fight&&(g.view==='fight');
  const huntOn=UI.hunt&&!g.fight&&g.view==='main'&&g.loc!=='camp';
  if(!fightAuto&&!huntOn)return;
  UI.timer=setTimeout(()=>{
    UI.timer=null;
    if(UI.auto&&g.fight&&g.view==='fight')autoStep();
    else if(UI.hunt&&!g.fight&&g.view==='main'&&g.loc!=='camp')huntStep();
    render();
  },fightAuto?420:520);
}
function render(){checkAch();renderStatus();renderDeck();save();schedule();}

/* ================= BOOT ================= */
function boot(){
  g=load();
  if(g){
    if(g.fight&&!g.fight.p)g.fight=null;
    if(g.fight)g.view=g.view==='fpack'?'fpack':'fight';
    else if(g.scene)g.view='scene';
    else if(g.delve)g.view='delve';
    else if(['fight','fpack','event','scene','delve'].indexOf(g.view)>=0)g.view='main';
    g.log.forEach(([t,c])=>say(t,c,false));
    if(g.fl.migrated&&!g.fl.migsaid){g.fl.migsaid=1;say('Welcome back. Your level, upgrades, echoes and items came with you. The story begins again, bigger.','lvl');}
  }else newGame();
  render();
}
boot();
if(window.__HF_TEST||window.__HF_HOOK){window.__hfe=s=>eval(s);}
if(window.__HF_TEST)UI.noTimers=true;

})();
